<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muss — Library &amp; Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/01-base.css">
<link rel="stylesheet" href="css/02-dashboard.css">
<link rel="stylesheet" href="css/03-views.css">
</head>
<body>

<div id="screen-workbench" class="screen">
<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div class="brand-name">Muss<small>Song Workbench</small></div>
    </div>
    <button class="wb-back" id="wbBack" title="Volver a la biblioteca">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4l-6 6 6 6"/></svg>
      Biblioteca
    </button>
    <div class="song-info">
      <div class="info-cell"><label>Title</label><input id="songTitle" type="text" placeholder="Untitled track"></div>
      <div class="info-cell"><label>Artist</label><input id="songArtist" type="text" placeholder="Unknown"></div>
      <div class="info-cell link"><label>Reference</label><input id="songLink" type="text" placeholder="https://..."></div>
    </div>
    <div class="top-actions">
      <button class="action-btn" data-action="import">↓ Import</button>
      <button class="action-btn primary" data-action="export">↑ Export</button>
      <input id="importFile" type="file" accept=".json,.cover">
    </div>
  </div>

  <!-- TRANSPORT -->
  <div class="transport">
    <div class="play-cluster">
      <button class="pbtn" id="rewindBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="pbtn play" id="playBtn"><svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="pbtn" id="stopBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg></button>
    </div>
    <div class="dial">
      <span class="dial-label">BPM</span>
      <input type="number" id="bpmInput" min="20" max="300" value="120">
      <div class="dial-stepper">
        <button data-action="bpm-up">▲</button>
        <button data-action="bpm-down">▼</button>
      </div>
    </div>
    <div class="dial">
      <span class="dial-label">Sig</span>
      <div class="pick-group" id="sigPick">
        <button data-sig="3/4">3/4</button>
        <button data-sig="4/4" class="active">4/4</button>
        <button data-sig="6/8">6/8</button>
        <button data-sig="7/8">7/8</button>
      </div>
    </div>
    <div class="dial" style="border-right:none">
      <span class="dial-label">Pulse</span>
      <div class="beat-led-row" id="beatLeds"></div>
    </div>
    <div class="dial">
      <span class="dial-label">Count-in</span>
      <div class="pick-group" id="countInPick">
        <button data-ci="0">Off</button>
        <button data-ci="1" class="active">1 bar</button>
        <button data-ci="2">2 bar</button>
      </div>
    </div>
    <div class="scroll-toggle">
      <span class="dial-label">Auto-scroll</span>
      <div class="toggle on" id="autoScroll" data-action="toggle-autoscroll"></div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <aside class="sidebar">
      <div class="sidebar-head">
        <h3>Channels</h3>
        <button class="add-ch-btn" data-action="open-channel-modal">+</button>
      </div>
      <div class="channels-list" id="channelsList"></div>
      <div class="view-tabs">
        <button class="view-tab" data-view="channel">Channel</button>
        <button class="view-tab active" data-view="overview">Overview</button>
        <button class="view-tab" data-view="reading">Lectura</button>
        <button class="view-tab" data-view="timeline">Timeline</button>
      </div>
    </aside>
    <section class="editor" id="editor">
      <div class="editor-head" id="editorHead"></div>
      <div class="canvas" id="canvas"></div>
    </section>
  </div>
</div>

<!-- MODAL -->
<div class="modal-mask" id="channelModal">
  <div class="modal">
    <div class="modal-head">New Channel</div>
    <div class="modal-body">
      <label>Type</label>
      <select id="newChType">
        <option value="lyrics">Lyrics</option>
        <option value="lead">Lead Guitar (Tab)</option>
        <option value="rhythm">Rhythm Guitar (Chords)</option>
        <option value="bass">Bass (Tab)</option>
        <option value="drums">Drums (Grid)</option>
        <option value="keys">Keys</option>
        <option value="notes">Notes / Other</option>
      </select>
      <label>Name</label>
      <input id="newChName" type="text" placeholder="e.g. Lead vocals, Guitar 1…">
    </div>
    <div class="modal-foot">
      <button data-action="close-channel-modal">Cancel</button>
      <button class="primary" data-action="confirm-channel">Add</button>
    </div>
  </div>
</div>

<!-- /workbench app + its modal live above; close the screen wrapper -->
</div><!-- #screen-workbench -->

<!-- ════════ LIBRARY SCREEN ════════ -->
<div id="screen-library" class="screen active">
  <div class="lib-app">
    <header class="lib-topbar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div class="brand-name">Muss<small>Song Workbench</small></div>
      </div>
      <div class="lib-search">
        <div class="lib-search-wrap">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="6"/><path d="M15 15l3 3"/></svg>
          <input class="lib-search-input" id="libSearch" type="text" placeholder="Buscar canciones, artistas…" autocomplete="off">
        </div>
      </div>
      <div class="lib-top-actions">
        <button class="action-btn lib-hide-mobile" id="libImportBtn">↓ Importar</button>
        <button class="action-btn primary" id="libNewBtn">+ Nueva canción</button>
        <button class="lib-menu-btn" id="libMenuBtn" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
        </button>
      </div>
    </header>

    <div class="lib-body">
      <div class="lib-overlay" id="libOverlay"></div>
      <nav class="lib-sidebar" id="libSidebar">
        <div class="lib-side-section">
          <div class="lib-side-label">Biblioteca</div>
          <div class="lib-nav active" data-nav="all">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="7" height="7" rx="1.5"/><rect x="11" y="3" width="7" height="7" rx="1.5"/><rect x="2" y="12" width="7" height="7" rx="1.5"/><rect x="11" y="12" width="7" height="7" rx="1.5"/></svg>
            Todas<span class="lib-nav-count" id="cntAll">0</span>
          </div>
          <div class="lib-nav" data-nav="recent">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></svg>
            Recientes<span class="lib-nav-count" id="cntRecent">0</span>
          </div>
          <div class="lib-nav" data-nav="favorites">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 16s-7-4.35-7-8.5a4.5 4.5 0 019 0 4.5 4.5 0 019 0C21 11.65 10 16 10 16z"/></svg>
            Favoritas<span class="lib-nav-count" id="cntFav">0</span>
          </div>
        </div>
        <div class="lib-side-section grow">
          <div class="lib-side-label">Género</div>
          <div class="lib-genres" id="libGenres"></div>
        </div>
      </nav>

      <main class="lib-content" id="libContent">
        <div class="lib-toolbar">
          <div class="lib-title" id="libTitle">Todas las canciones</div>
          <div class="lib-sort">
            <span class="lib-sort-label">Ordenar</span>
            <div class="pick-group" id="libSort">
              <button class="active" data-sort="artist">Artista</button>
              <button data-sort="title">Título</button>
              <button data-sort="genre">Género</button>
              <button data-sort="bpm">BPM</button>
            </div>
          </div>
          <div class="lib-vtoggle" id="libView">
            <button class="active" data-view="grid" title="Cuadrícula">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
            </button>
            <button data-view="list" title="Lista">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="1" y1="4" x2="15" y2="4"/><line x1="1" y1="8" x2="15" y2="8"/><line x1="1" y1="12" x2="15" y2="12"/></svg>
            </button>
            <button data-view="table" title="Tabla">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1" y="2" width="14" height="12" rx="1"/><line x1="1" y1="6" x2="15" y2="6"/><line x1="6" y1="6" x2="6" y2="14"/><line x1="11" y1="6" x2="11" y2="14"/></svg>
            </button>
          </div>
        </div>
        <div id="libList"></div>
      </main>
    </div>
  </div>
</div>

<!-- New-song modal -->
<div class="modal-mask" id="newSongModal">
  <div class="modal">
    <div class="modal-head">Nueva canción</div>
    <div class="modal-body">
      <div class="lib-field"><label>Título</label><input type="text" id="ns_title" placeholder="Nombre de la canción"></div>
      <div class="lib-field"><label>Artista</label><input type="text" id="ns_artist" placeholder="Artista o banda"></div>
      <div class="lib-field"><label>Género</label>
        <select id="ns_genre">
          <option value="">— Sin género —</option>
          <option value="Rock">Rock</option><option value="Pop">Pop</option><option value="Jazz">Jazz</option>
          <option value="Metal">Metal</option><option value="Folk">Folk</option><option value="Blues">Blues</option>
          <option value="Latin">Latin</option><option value="Indie">Indie</option><option value="Country">Country</option>
          <option value="Other">Otro</option>
        </select>
      </div>
      <div class="lib-field-row">
        <div class="lib-field"><label>BPM</label><input type="number" id="ns_bpm" value="120" min="20" max="300"></div>
        <div class="lib-field"><label>Compás</label>
          <select id="ns_sig"><option>4/4</option><option>3/4</option><option>6/8</option><option>5/4</option><option>7/8</option></select>
        </div>
      </div>
      <div class="lib-field"><label>Link de referencia</label><input type="url" id="ns_link" placeholder="https://youtube.com/…"></div>
    </div>
    <div class="modal-foot">
      <button id="ns_cancel">Cancelar</button>
      <button class="primary" id="ns_create">Crear canción</button>
    </div>
  </div>
</div>

<input type="file" id="libImportFile" accept=".json,.muss.json" style="display:none">


<script src="js/01-state.js"></script>
<script src="js/02-core.js"></script>
<script src="js/03-shell.js"></script>
<script src="js/04-channel.js"></script>
<script src="js/05-overview.js"></script>
<script src="js/06-reading.js"></script>
<script src="js/07-chord-engine.js"></script>
<script src="js/08-library.js"></script>
</body>
</html>
