      <div class="lib-field"><label>Link de referencia</label><input type="url" id="ns_link" placeholder="https://youtube.com/…"></div>
    </div>
    <div class="modal-foot">
      <button id="ns_cancel">Cancelar</button>
      <button class="primary" id="ns_create">Crear canción</button>
    </div>
  </div>
</div>

<input type="file" id="libImportFile" accept=".json,.muss.json" style="display:none">


<script>
/* ── State ── */
const STATE={song:{title:'',artist:'',link:'',bpm:120,signature:'4/4',blocks:[],channels:[],progressions:[],library:{riffs:[]}},ui:{activeChannelId:null,view:'overview',rhythmTab:'blocks',tabTab:'blocks',isPlaying:false,currentBlockIndex:0,currentBeat:0,autoScroll:true,metronomeTimer:null,countIn:1,isCountingIn:false,countInBeatsLeft:0,blockProgress:0}};
const CH_COLORS=['#4f6ef7','#2a9d8f','#e05c3a','#c46bb0','#7c69f5','#c08040','#4aab6d','#d4521e'];
const CH_TYPE_INFO={lyrics:{letter:'L',label:'Lyrics'},lead:{letter:'G',label:'Lead Gtr'},rhythm:{letter:'R',label:'Rhythm'},bass:{letter:'B',label:'Bass'},drums:{letter:'D',label:'Drums'},keys:{letter:'K',label:'Keys'},notes:{letter:'N',label:'Notes'}};
const SECTION_OPTIONS=['INTRO','VERSE','PRE-CHORUS','CHORUS','BRIDGE','SOLO','INSTRUMENTAL','BREAKDOWN','OUTRO'];
const SECTION_COLORS={INTRO:'#7c69f5',VERSE:'#2a9d8f','PRE-CHORUS':'#4fa8b8',CHORUS:'#e05c3a',BRIDGE:'#c46bb0',SOLO:'#d4521e',INSTRUMENTAL:'#4aab6d',BREAKDOWN:'#c08040',OUTRO:'#7c69f5'};
const uid=()=>'id_'+Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}
function escapeHTML(s){return s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sigBeats(){return parseInt(STATE.song.signature.split('/')[0])}
function flash(m){const e=document.createElement('div');e.className='flash';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}

/* ── Channels ── */
function defaultContent(t){switch(t){case'drums':return{pattern:{}};case'lead':case'bass':return{tab:defaultTab(t)};case'rhythm':return{chords:[],notes:''};default:return{text:''}}}
function defaultTab(t){return t==='bass'?'G|----------------|\nD|----------------|\nA|----------------|\nE|----------------|':'e|----------------|\nB|----------------|\nG|----------------|\nD|----------------|\nA|----------------|\nE|----------------|'}
function addChannel(name,type){const id=uid(),c=CH_COLORS[STATE.song.channels.length%CH_COLORS.length];STATE.song.channels.push({id,name,type,color:c,muted:false});STATE.song.blocks.forEach(b=>{if(!b.content[id])b.content[id]=defaultContent(type)});return id}
function deleteChannel(id){if(STATE.song.channels.length<=1){flash('Need at least 1 channel');return}STATE.song.channels=STATE.song.channels.filter(c=>c.id!==id);STATE.song.blocks.forEach(b=>{delete b.content[id]});if(STATE.ui.activeChannelId===id)STATE.ui.activeChannelId=STATE.song.channels[0].id;renderAll()}
function toggleMute(id){const c=STATE.song.channels.find(x=>x.id===id);if(c)c.muted=!c.muted;renderAll()}
function renameChannel(id,name){const c=STATE.song.channels.find(x=>x.id===id);if(c){c.name=name;renderChannelsList()}}
function blockHasContent(b,ch){const c=b.content[ch.id];if(!c)return false;if(ch.type==='drums')return Object.values(c.pattern||{}).some(a=>a.some(v=>v));if(ch.type==='rhythm')return(c.chords&&c.chords.length)||(c.notes&&c.notes.trim());if(ch.type==='lead'||ch.type==='bass'){if(!c.tab)return false;const txt=normalizeTab(c.tab,tabType(ch));return /[0-9xXhHpPbB]/.test(txt)}return c.text&&c.text.trim()}

/* ── Blocks ── */
function addBlock(s='VERSE',b=4){const bl={id:uid(),section:s,bars:b,enabled:true,comment:'',content:{}};STATE.song.channels.forEach(c=>{bl.content[c.id]=defaultContent(c.type)});STATE.song.blocks.push(bl);return bl.id}
function deleteBlock(id){STATE.song.blocks=STATE.song.blocks.filter(b=>b.id!==id);renderAll()}
function duplicateBlock(id){const i=STATE.song.blocks.findIndex(b=>b.id===id);if(i===-1)return;const c=JSON.parse(JSON.stringify(STATE.song.blocks[i]));c.id=uid();STATE.song.blocks.splice(i+1,0,c);renderAll()}
function toggleBlockEnabled(id){const b=STATE.song.blocks.find(b=>b.id===id);if(b)b.enabled=!b.enabled;renderAll()}
function moveBlock(fid,tid){if(fid===tid)return;const bs=STATE.song.blocks,fi=bs.findIndex(b=>b.id===fid),ti=bs.findIndex(b=>b.id===tid);if(fi===-1||ti===-1)return;const[it]=bs.splice(fi,1);bs.splice(ti,0,it);renderAll()}
function insertBlockAt(i){const bl={id:uid(),section:'VERSE',bars:4,enabled:true,comment:'',content:{}};STATE.song.channels.forEach(c=>{bl.content[c.id]=defaultContent(c.type)});STATE.song.blocks.splice(i,0,bl);renderAll();flash('Block inserted')}
function makeInsertZone(i){const z=document.createElement('div');z.className='block-insert-zone';const b=document.createElement('button');b.className='block-insert-btn';b.textContent='+';b.addEventListener('click',e=>{e.stopPropagation();insertBlockAt(i)});z.appendChild(b);return z}
function setSection(id,v){const b=STATE.song.blocks.find(x=>x.id===id);if(b){b.section=v;renderEditor()}}
function setBars(id,v){
  const b=STATE.song.blocks.find(x=>x.id===id);if(!b)return;
  const oldBars=b.bars;
  b.bars=clamp(parseInt(v)||4,1,32);
  if(b.bars!==oldBars){
    // Rescale every tab channel in this block proportionally to the new bar count.
    STATE.song.channels.forEach(ch=>{
      if(ch.type==='lead'||ch.type==='bass'){
        const type=tabType(ch);
        const grid=parseTabGrid(b.content[ch.id]?.tab,type);
        rescaleGridCols(grid, b.bars*tabColsPerBar());
        if(!b.content[ch.id])b.content[ch.id]={};
        b.content[ch.id].tab={cols:grid.cols.map(c=>({...c}))};
      }
    });
  }
  renderEditor();
}
function setComment(id,v){const b=STATE.song.blocks.find(x=>x.id===id);if(b)b.comment=v}
function setText(ci,bi,v,k='text'){const b=STATE.song.blocks.find(x=>x.id===bi);if(!b)return;if(!b.content[ci])b.content[ci]={};b.content[ci][k]=v}
/* Chord model: each chord is {name, beats}. Older data may store plain
   strings — normalizeChord() upgrades them on read. */
function normalizeChord(c){
  if(typeof c==='string') return {name:c, beats:sigBeats()};
  const o={name:c.name||'', beats:c.beats||sigBeats()};
  if(c.br)o.br=true;            // line-break AFTER this chord (for syncing with lyric lines)
  return o;
}
function getChords(block,ci){
  const arr=(block.content[ci]?.chords)||[];
  return arr.map(normalizeChord);
}
function addChord(ci,bi){const b=STATE.song.blocks.find(x=>x.id===bi);if(!b.content[ci])b.content[ci]={chords:[],notes:''};if(!b.content[ci].chords)b.content[ci].chords=[];b.content[ci].chords=getChords(b,ci);b.content[ci].chords.push({name:'Am',beats:sigBeats()});renderEditor()}
/* Group a flat chord array into lines, breaking after any chord flagged br. */
function chordLines(chords){
  const lines=[[]];
  chords.forEach((c,i)=>{ lines[lines.length-1].push({c,i}); if(c.br && i<chords.length-1) lines.push([]); });
  return lines;
}
function blockLyricLineCount(block){
  const ly=getLyricsChannel();
  const t=block.content[ly.id]?.text||'';
  return t.length? t.split('\n').length : 1;
}
/* Toggle a line break after chord i. */
function toggleChordBreak(ci,bi,i){
  const b=STATE.song.blocks.find(x=>x.id===bi);if(!b)return;
  const ch=getChords(b,ci); if(!ch[i])return;
  if(ch[i].br)delete ch[i].br; else ch[i].br=true;
  b.content[ci].chords=ch; renderEditor();
}
function clearChordBreaks(ci,bi){
  const b=STATE.song.blocks.find(x=>x.id===bi);if(!b)return;
  const ch=getChords(b,ci); ch.forEach(c=>delete c.br);
  b.content[ci].chords=ch; renderEditor();
}
/* Distribute chords into as many lines as the block's lyrics, setting breaks. */
function syncChordsToLyrics(ci,bi){
  const b=STATE.song.blocks.find(x=>x.id===bi);if(!b)return;
  const ch=getChords(b,ci); const N=blockLyricLineCount(b);
  if(!ch.length){flash('No hay acordes');return}
  ch.forEach(c=>delete c.br);
  for(let k=1;k<N;k++){
    const idx=Math.round(k*ch.length/N)-1;
    if(idx>=0 && idx<ch.length-1) ch[idx].br=true;
  }
  b.content[ci].chords=ch; renderEditor();
  flash(`Acordes repartidos en ${N} línea${N>1?'s':''}`);
}

function updateChord(ci,bi,i,v){const b=STATE.song.blocks.find(x=>x.id===bi);b.content[ci].chords=getChords(b,ci);v=v.trim();if(!v){b.content[ci].chords.splice(i,1);renderEditor()}else{b.content[ci].chords[i].name=v}}

/* ── Chord progressions (reusable patterns with alias) ── */
function ensureProgs(){if(!STATE.song.progressions)STATE.song.progressions=[]}
function saveProgression(ci,bi){
  ensureProgs();
  const b=STATE.song.blocks.find(x=>x.id===bi);
  const chords=getChords(b,ci);
  if(!chords.length){flash('No chords to save');return}
  // Duplicate check: same chord names AND same beats in same order
  const fingerprint=chords.map(c=>c.name+'|'+c.beats).join(',');
  const dup=STATE.song.progressions.find(p=>{
    const fp=p.chords.map(c=>(c.name||c)+'|'+(c.beats||sigBeats())).join(',');
    return fp===fingerprint;
  });
  if(dup){flash('Pattern already exists as "'+dup.name+'"');return}
  const name=prompt('Name this chord pattern (alias):','Pattern '+(STATE.song.progressions.length+1));
  if(name===null)return;
  STATE.song.progressions.push({id:uid(),name:name.trim()||('Pattern '+(STATE.song.progressions.length+1)),chords:JSON.parse(JSON.stringify(chords))});
  flash('Pattern saved');
  renderEditor();
}
function applyProgression(ci,bi,progId){
  ensureProgs();
  const prog=STATE.song.progressions.find(p=>p.id===progId);
  if(!prog)return;
  const b=STATE.song.blocks.find(x=>x.id===bi);
  if(!b.content[ci])b.content[ci]={chords:[],notes:''};
  // Track applied patterns on the block (max 2)
  if(!b.content[ci].appliedPatterns)b.content[ci].appliedPatterns=[];
  if(!b.content[ci].appliedPatterns.includes(progId)){
    if(b.content[ci].appliedPatterns.length>=2){flash('Max 2 patterns per block');return}
    b.content[ci].appliedPatterns.push(progId);
  }
  b.content[ci].chords=JSON.parse(JSON.stringify(prog.chords));
  flash('Applied "'+prog.name+'"');
  renderEditor();
}
function removePatternFromBlock(ci,bi,progId){
  const b=STATE.song.blocks.find(x=>x.id===bi);if(!b||!b.content[ci])return;
  if(!b.content[ci].appliedPatterns)b.content[ci].appliedPatterns=[];
  b.content[ci].appliedPatterns=b.content[ci].appliedPatterns.filter(id=>id!==progId);
  renderEditor();
}
function deleteProgression(progId){
  ensureProgs();
  STATE.song.progressions=STATE.song.progressions.filter(p=>p.id!==progId);
  // Also remove from any block that had it applied
  STATE.song.blocks.forEach(b=>Object.values(b.content).forEach(c=>{
    if(c.appliedPatterns)c.appliedPatterns=c.appliedPatterns.filter(id=>id!==progId);
  }));
  renderEditor();
}
function renameProgression(progId){
  ensureProgs();
  const p=STATE.song.progressions.find(x=>x.id===progId);
  if(!p)return;
  const n=prompt('Rename pattern:',p.name);
  if(n!==null){p.name=n.trim()||p.name;renderEditor()}
}

/* ── Chord drag-to-resize (replaces +/- buttons) ── */
function bindChordDrag(ci,bi){document.querySelectorAll(`.chord-slots[data-ch="${ci}"][data-block="${bi}"]`).forEach(bindChordResizeGeneric)}
function rhythmTabsHTML(ch){
  const tabs=[['blocks','Blocks'],['patterns','Patterns'],['chords','Chords']];
  return`<div class="rhythm-tabs">${tabs.map(([k,lbl])=>`<button class="rhythm-tab${STATE.ui.rhythmTab===k?' active':''}" onclick="setRhythmTab('${k}')">${lbl}</button>`).join('')}</div>`;
}
function setRhythmTab(tab){STATE.ui.rhythmTab=tab;renderEditor()}

/* ── Pattern catalog ── */
/* Normalize a pattern's chords, preserving line breaks (br). */
function progChords(prog){
  return (prog.chords||[]).map(c=> typeof c==='string'
    ? {name:c,beats:sigBeats()}
    : {name:c.name||'',beats:c.beats||sigBeats(),...(c.br?{br:true}:{})});
}
function progChordLines(chords){
  const lines=[[]];
  chords.forEach((c,i)=>{lines[lines.length-1].push({c,i});if(c.br&&i<chords.length-1)lines.push([])});
  return lines;
}
/* When a pattern's line structure changes, mirror the breaks onto any block
   that has this pattern applied (so Overview/Lectura reflect it). */
function propagateProgBreaks(progId){
  const p=STATE.song.progressions.find(x=>x.id===progId);if(!p)return;
  STATE.song.blocks.forEach(b=>Object.values(b.content).forEach(c=>{
    if(c.appliedPatterns&&c.appliedPatterns.includes(progId)&&Array.isArray(c.chords)&&c.chords.length===p.chords.length){
      c.chords.forEach((cc,k)=>{ if(typeof cc==='string')return; if(p.chords[k]&&p.chords[k].br)cc.br=true; else delete cc.br; });
    }
  }));
}
/* Toggle a line break after chord i — enforcing a minimum of 1 bar per line. */
function toggleProgBreak(progId,i){
  ensureProgs();
  const p=STATE.song.progressions.find(x=>x.id===progId);if(!p||!p.chords[i])return;
  const bpb=sigBeats();
  const ch=p.chords;
  if(ch[i].br){delete ch[i].br;}
  else{
    let startIdx=0;for(let k=i-1;k>=0;k--){if(ch[k].br){startIdx=k+1;break}}
    const lineBeats=ch.slice(startIdx,i+1).reduce((s,c)=>s+(c.beats||bpb),0);
    let endIdx=ch.length-1;for(let k=i+1;k<ch.length;k++){if(ch[k].br){endIdx=k;break}}
    const nextBeats=ch.slice(i+1,endIdx+1).reduce((s,c)=>s+(c.beats||bpb),0);
    if(lineBeats<bpb || (i<ch.length-1 && nextBeats<bpb)){flash('Cada línea debe tener al menos 1 compás');return}
    ch[i].br=true;
  }
  propagateProgBreaks(progId);renderEditor();
}
/* Auto-group: break into lines of (at least) one bar each. */
function autoBarLines(progId){
  ensureProgs();
  const p=STATE.song.progressions.find(x=>x.id===progId);if(!p)return;
  const bpb=sigBeats();let acc=0;
  p.chords.forEach(c=>{if(typeof c!=='string')delete c.br});
  p.chords.forEach((c,i)=>{const bt=(c.beats||bpb);acc+=bt;if(acc>=bpb-1e-6 && i<p.chords.length-1){if(typeof c!=='string')c.br=true;acc=0}});
  propagateProgBreaks(progId);renderEditor();
  flash('Líneas de 1 compás');
}
function clearProgBreaks(progId){
  ensureProgs();
  const p=STATE.song.progressions.find(x=>x.id===progId);if(!p)return;
  p.chords.forEach(c=>{if(typeof c!=='string')delete c.br});
  propagateProgBreaks(progId);renderEditor();
}
/* Reorder chords within a pattern (drag-and-drop). br travels with the chord. */
function moveProgChord(progId,from,to){
  ensureProgs();
  const p=STATE.song.progressions.find(x=>x.id===progId);if(!p||from===to||from==null||to==null)return;
  const arr=p.chords;if(from<0||from>=arr.length)return;
  const [m]=arr.splice(from,1);
  let t=to>from?to-1:to;t=Math.max(0,Math.min(arr.length,t));
  arr.splice(t,0,m);
  propagateProgBreaks(progId);renderEditor();
}

function renderPatternCatalog(ch,cv){
  ensureProgs();cv.innerHTML='';
  const t=document.createElement('div');t.innerHTML=rhythmTabsHTML(ch);cv.appendChild(t.firstElementChild);
  const wrap=document.createElement('div');wrap.className='pattern-catalog';
  if(!STATE.song.progressions.length){
    wrap.innerHTML='<div class="pattern-catalog-empty">No patterns saved yet.<br>Go to <b>Blocks</b> and click <b>★ Save as pattern</b> on any chord progression.</div>';
    cv.appendChild(wrap);return;
  }
  const grid=document.createElement('div');grid.className='pattern-grid';const bpb=sigBeats();
  STATE.song.progressions.forEach(prog=>{
    const ref={type:'prog',progId:prog.id};
    const chords=progChords(prog);
    const totalBeats=chords.reduce((s,c)=>s+c.beats,0);
    const numBars=Math.max(1,Math.round(totalBeats/bpb));
    const lines=chordsToLines(chords);
    const stack=renderChordLineStack(ref,chords);
    const card=document.createElement('div');card.className='pattern-card';
    card.innerHTML=`
      <div class="pattern-card-head">
        <input class="pattern-card-name" value="${escapeHTML(prog.name)}" spellcheck="false" onblur="renameProgById('${prog.id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()" title="Click to rename">
        <span style="font-size:9px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;white-space:nowrap">${chords.length} chord${chords.length!==1?'s':''} · ${totalBeats} beats · ${numBars} bar${numBars!==1?'s':''} · ${lines.length} línea${lines.length!==1?'s':''}</span>
        <button class="pattern-card-del" onclick="deleteProgression('${prog.id}')" title="Delete">×</button>
      </div>
      <div class="pattern-card-body">
        <div class="chord-lines-toolbar">
          <button class="cl-btn" onclick="gcAutoBars('${refTok(ref)}')" title="Una línea por compás">⊞ 1 compás/línea</button>
          <button class="cl-btn" onclick="gcClear('${refTok(ref)}')" title="Unir todo en una línea">⥶ Unir en 1</button>
          <span class="cl-hint">↵ corta línea · ⠿ arrastrá para mover de línea</span>
        </div>
        ${stack}
        <div class="chord-fill under" id="pfill_${prog.id}" style="margin:6px 0 10px">${totalBeats} beats total</div>
        <div class="pattern-card-actions">
          <button class="pattern-apply-btn" onclick="applyPatternToBlock('${ch.id}','${prog.id}')">Apply to block…</button>
          <button class="pattern-dup-btn" onclick="duplicatePattern('${prog.id}')">⧉ Duplicate &amp; edit</button>
        </div>
      </div>`;
    grid.appendChild(card);
  });
  wrap.appendChild(grid);cv.appendChild(wrap);
  requestAnimationFrame(()=>{document.querySelectorAll('.chord-slots[data-prog]').forEach(bindChordResizeGeneric);bindChordDnDAll()});
}
function renameProgById(progId,name){ensureProgs();const p=STATE.song.progressions.find(x=>x.id===progId);if(p&&name.trim())p.name=name.trim()}

/* Edit chord name in pattern catalog */
function updateProgChord(progId,idx,name){
  ensureProgs();
  const p=STATE.song.progressions.find(x=>x.id===progId);
  if(!p)return;
  name=name.trim();
  if(!name){p.chords.splice(idx,1);}
  else{if(!p.chords[idx])return;p.chords[idx].name=name;}
  // Update meta label
  const slotsEl=document.getElementById('pslots_'+progId);
  const fillEl=document.getElementById('pfill_'+progId);
  if(!name&&slotsEl){
    // Re-render the card by refreshing the pattern catalog view
    renderEditor();return;
  }
  if(fillEl){
    const total=p.chords.reduce((s,c)=>s+(c.beats||sigBeats()),0);
    fillEl.textContent=total+' beats total';
    const metaEl=slotsEl?.closest('.pattern-card-body')?.querySelector('.pattern-meta');
    if(metaEl)metaEl.textContent=p.chords.length+' chord'+(p.chords.length!==1?'s':'')+' · '+total+' beats';
  }
}

/* Add a chord to a pattern directly from the catalog */
function addProgChord(progId){
  ensureProgs();
  const p=STATE.song.progressions.find(x=>x.id===progId);
  if(!p)return;
  p.chords.push({name:'Am',beats:sigBeats()});
  renderEditor();
}

/* Duplicate a pattern and save as new — requires at least one change (checked on save) */
function duplicatePattern(progId){
  ensureProgs();
  const src=STATE.song.progressions.find(x=>x.id===progId);
  if(!src)return;
  const name=prompt('Name for the new pattern (must differ from original):',src.name+' (copy)');
  if(name===null)return;
  const trimmed=name.trim()||src.name+' (copy)';
  // Clone chords deep
  const cloned=JSON.parse(JSON.stringify(src.chords));
  // Fingerprint check: cloned is identical to source by definition — warn the user
  // they need to edit it after saving. Duplication always creates a new entry.
  // If the NAME already exists, reject.
  if(STATE.song.progressions.some(p=>p.name===trimmed)){
    flash('A pattern named "'+trimmed+'" already exists');return;
  }
  STATE.song.progressions.push({id:uid(),name:trimmed,chords:cloned});
  flash('Duplicated as "'+trimmed+'" — edit the chords or timings to differentiate');
  renderEditor();
}

/* Drag-to-resize for pattern chord slots — mirrors bindChordDrag but for progressions */
/* Drag-to-resize across each line's container (beats stay within the line). */
function bindPatternChordDrag(progId){document.querySelectorAll(`.chord-slots[data-prog="${progId}"]`).forEach(bindChordResizeGeneric)}

function applyPatternToBlock(ci,progId){
  ensureProgs();
  if(!STATE.song.blocks.length){flash('No blocks to apply to');return}
  document.getElementById('_patternPicker')?.remove();
  const box=document.createElement('div');box.id='_patternPicker';
  box.style.cssText='position:fixed;bottom:60px;right:20px;background:var(--bg-0);border:1px solid var(--line-mid);border-radius:10px;padding:12px;z-index:3000;box-shadow:0 8px 32px rgba(0,0,0,.15);min-width:200px;font-family:Inter,sans-serif;font-size:12px';
  box.innerHTML=`<div style="font-weight:600;margin-bottom:8px;color:var(--ink)">Apply to block:</div>${STATE.song.blocks.map((b,i)=>`<div onclick="doApplyPattern('${ci}','${b.id}','${progId}')" style="padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--ink-dim)" onmouseover="this.style.background='var(--accent-bg)'" onmouseout="this.style.background=''">${String(i+1).padStart(2,'0')} · ${b.section}</div>`).join('')}<div onclick="document.getElementById('_patternPicker')?.remove()" style="margin-top:8px;padding:5px 8px;border-radius:6px;cursor:pointer;color:var(--ink-faint);font-size:11px;border-top:1px solid var(--line)">Cancel</div>`;
  document.body.appendChild(box);

function guessSec(t){const f=t.split('\n')[0].trim().toUpperCase().replace(/[\[\]():]/g,'').replace(/\d+/g,'').trim();const m={INTRO:'INTRO',VERSE:'VERSE','PRE-CHORUS':'PRE-CHORUS',PRECHORUS:'PRE-CHORUS',CHORUS:'CHORUS',HOOK:'CHORUS',BRIDGE:'BRIDGE',SOLO:'SOLO',INSTRUMENTAL:'INSTRUMENTAL',BREAKDOWN:'BREAKDOWN',OUTRO:'OUTRO',ENDING:'OUTRO'};for(const k in m)if(f===k||f.startsWith(k+' '))return m[k];return'VERSE'}

/* ── Structured Tab Editor ──────────────────────────────
   Tab is stored as a column grid so the 6/4-string frame can NEVER
   break (no deleting prefixes, no losing newlines). Each column holds
   one character per string. The "e|" prefix and trailing "|" are a
   fixed visual frame, not editable text. Font auto-scales so the whole
   riff fits the slot width — no scrollbars. */
const TAB_STRINGS={guitar:['e','B','G','D','A','E'],bass:['G','D','A','E']};
function tabStringSet(type){return type==='bass'?TAB_STRINGS.bass:TAB_STRINGS.guitar}
function tabType(ch){return ch.type==='bass'?'bass':'guitar'}
/* Tab time resolution: how many character-columns make up one bar.
   beatsPerBar × subdivision (16th notes). 4/4 → 4×4 = 16 cols/bar. */
const TAB_SUBDIV=4;
function tabColsPerBar(){return sigBeats()*TAB_SUBDIV}
function tabTotalCols(block){return Math.max(tabColsPerBar(),block.bars*tabColsPerBar())}

/* Parse stored tab into a column grid: {labels, cols:[ {e:'-',B:'-',...}, ... ]} */
function parseTabGrid(stored,type){
  const labels=tabStringSet(type);
  // stored may be: legacy text "e|---|\n...", or {cols:[...]}, or empty
  if(stored && typeof stored==='object' && Array.isArray(stored.cols)){
    // sanitise: ensure every column has every label
    const cols=stored.cols.map(col=>{
      const c={}; labels.forEach(l=>{ c[l]=(col&&typeof col[l]==='string'&&col[l].length)?col[l][0]:'-'; });
      return c;
    });
    return {labels, cols: cols.length?cols:freshCols(labels,16)};
  }
  // legacy/pasted text → normalise then convert to columns
  const text=typeof stored==='string'?stored:'';
  const norm=normalizeTabText(text,type);
  const bodyByLabel={};
  norm.split('\n').forEach(line=>{
    const m=line.match(/^([A-Ga-g][#b]?)\|(.*)\|$/);
    if(m) bodyByLabel[m[1]]=m[2];
  });
  const width=Math.max(16,...labels.map(l=>(bodyByLabel[l]||'').length));
  const cols=[];
  for(let x=0;x<width;x++){
    const c={}; labels.forEach(l=>{ const b=bodyByLabel[l]||''; c[l]=b[x]||'-'; });
    cols.push(c);
  }
  return {labels, cols};
}
function freshCols(labels,width){
  const cols=[];
  for(let x=0;x<width;x++){const c={};labels.forEach(l=>c[l]='-');cols.push(c)}
  return cols;
}

/* Serialise a column grid back to canonical text for export/preview. */
function gridToText(grid){
  return grid.labels.map(l=>l+'|'+grid.cols.map(c=>c[l]||'-').join('')+'|').join('\n');
}

/* Normalise free text into exact N strings (used for paste & legacy). */
function normalizeTabText(text,type){
  const labels=tabStringSet(type), n=labels.length;
  const raw=(text||'').replace(/\r\n/g,'\n').split('\n');
  const lines=[];
  raw.forEach(l=>{const m=l.match(/^\s*([A-Ga-g][#b]?)\s*\|(.*)$/);if(m)lines.push({label:m[1],body:m[2].replace(/\|+\s*$/,'')})});
  let maxLen=16; lines.forEach(o=>{if(o.body.length>maxLen)maxLen=o.body.length});
  let bodies;
  if(lines.length===n){bodies=lines.map(o=>o.body);}
  else{
    const byLabel={},used={}; lines.forEach(o=>{if(byLabel[o.label]==null)byLabel[o.label]=o.body});
    bodies=labels.map(lab=>{
      if(byLabel[lab]!=null)return byLabel[lab];
      const hit=lines.find(o=>o.label.toLowerCase()===lab.toLowerCase()&&!used[o.label]);
      if(hit){used[hit.label]=1;return hit.body} return null;
    });
  }
  return labels.map((lab,i)=>{let b=bodies[i];b=(b==null)?'-'.repeat(maxLen):b.padEnd(maxLen,'-');return lab+'|'+b+'|'}).join('\n');
}
/* Back-compat alias used elsewhere (timeline preview, blockHasContent). */
function normalizeTab(text,type){
  if(text&&typeof text==='object'&&Array.isArray(text.cols)) return gridToText({labels:tabStringSet(type),cols:text.cols});
  return normalizeTabText(text,type);
}

/* ── Live editing state (which cell the cursor is on) ── */
const TAB_CURSOR={}; // tid -> {col}

function getTabGridFromBlock(ci,bi,type){
  const b=STATE.song.blocks.find(x=>x.id===bi);
  if(!b)return null;
  if(!b.content[ci])b.content[ci]={};
  const grid=parseTabGrid(b.content[ci].tab,type);
  // Conform column count to the block's bars: pad/trim with dashes so the
  // tab always spans exactly `bars` measures (no loss of what's written).
  conformGridCols(grid,tabTotalCols(b));
  return grid;
}
/* Pad or trim grid.cols to exactly `target` columns, filling new ones with '-'. */
function conformGridCols(grid,target){
  if(grid.cols.length<target){
    while(grid.cols.length<target){const c={};grid.labels.forEach(l=>c[l]='-');grid.cols.push(c)}
  }else if(grid.cols.length>target){
    grid.cols.length=target;
  }
  return grid;
}
/* Rescale a grid proportionally to a new column count (when bars change).
   Each old column's notes map to their proportional new index. */
function rescaleGridCols(grid,newTotal){
  const old=grid.cols, oldN=old.length;
  if(oldN===0){conformGridCols(grid,newTotal);return grid}
  if(newTotal===oldN)return grid;
  const fresh=[];
  for(let x=0;x<newTotal;x++){const c={};grid.labels.forEach(l=>c[l]='-');fresh.push(c)}
  for(let x=0;x<oldN;x++){
    const ni=Math.round(x*(newTotal-1)/(oldN-1||1));
    grid.labels.forEach(l=>{
      const ch=old[x][l];
      if(ch&&ch!=='-'&&fresh[ni][l]==='-') fresh[ni][l]=ch;
    });
  }
  grid.cols=fresh;
  return grid;
}
function saveTabGrid(ci,bi,grid){
  const b=STATE.song.blocks.find(x=>x.id===bi);
  if(!b)return;
  if(!b.content[ci])b.content[ci]={};
  b.content[ci].tab={cols:grid.cols.map(c=>({...c}))};
}

/* Render the structured editor into a container. Auto-sizes font to fit. */
function renderTabEditor(ci,bi,type,containerId){
  const grid=getTabGridFromBlock(ci,bi,type);
  const cur=(TAB_CURSOR[containerId]&&TAB_CURSOR[containerId].col!=null)?TAB_CURSOR[containerId].col:grid.cols.length-1;
  const labels=grid.labels;
  const cpb=tabColsPerBar(); // columns per measure
  const bars=Math.max(1,Math.round(grid.cols.length/cpb));
  let rows='';
  labels.forEach(lab=>{
    let cells='';
    grid.cols.forEach((c,x)=>{
      // bar separator BEFORE this column when it starts a new measure (not the first)
      if(x>0 && x%cpb===0) cells+=`<span class="tbar tdiv">|</span>`;
      cells+=`<span class="tcell${x===cur?' tcur':''}" data-col="${x}" data-lab="${lab}">${escapeHTML(c[lab]||'-')}</span>`;
    });
    rows+=`<div class="trow"><span class="tlbl">${lab}</span><span class="tbar">|</span><span class="tbody">${cells}</span><span class="tbar">|</span></div>`;
  });
  return `<div class="tabgrid" id="${containerId}" tabindex="0"
    data-ci="${ci}" data-bi="${bi}" data-type="${type}" data-cols="${grid.cols.length}" data-bars="${bars}">${rows}</div>`;
}

/* Insert a blank column at the cursor (or append if none) on ALL strings. */
function tabInsertColumn(containerId){
  const el=document.getElementById(containerId); if(!el)return;
  const ci=el.dataset.ci,bi=el.dataset.bi,type=el.dataset.type;
  const grid=getTabGridFromBlock(ci,bi,type);
  const cur=(TAB_CURSOR[containerId]&&TAB_CURSOR[containerId].col!=null)?TAB_CURSOR[containerId].col:grid.cols.length-1;
  const at=clamp(cur+1,0,grid.cols.length);
  const blank={}; grid.labels.forEach(l=>blank[l]='-');
  grid.cols.splice(at,0,blank);
  saveTabGrid(ci,bi,grid);
  TAB_CURSOR[containerId]={col:at};
  refreshTabEditor(containerId);
}

/* Remove the column at the cursor on ALL strings (keeps ≥1 column). */
function tabRemoveColumn(containerId){
  const el=document.getElementById(containerId); if(!el)return;
  const ci=el.dataset.ci,bi=el.dataset.bi,type=el.dataset.type;
  const grid=getTabGridFromBlock(ci,bi,type);
  if(grid.cols.length<=1)return;
  const cur=(TAB_CURSOR[containerId]&&TAB_CURSOR[containerId].col!=null)?TAB_CURSOR[containerId].col:grid.cols.length-1;
  grid.cols.splice(cur,1);
  saveTabGrid(ci,bi,grid);
  TAB_CURSOR[containerId]={col:clamp(cur-1,0,grid.cols.length-1)};
  refreshTabEditor(containerId);
}

function refreshTabEditor(containerId){
  const el=document.getElementById(containerId); if(!el)return;
  const ci=el.dataset.ci,bi=el.dataset.bi,type=el.dataset.type;
  const html=renderTabEditor(ci,bi,type,containerId);
  const tmp=document.createElement('div'); tmp.innerHTML=html;
  el.replaceWith(tmp.firstElementChild);
  bindTabEditor(containerId);
  fitTabFont(containerId);
}

/* Auto-scale font so all columns fit the width — no horizontal scroll. */
function fitTabFont(containerId){
  const el=document.getElementById(containerId); if(!el)return;
  const cols=parseInt(el.dataset.cols)||16;
  const bars=parseInt(el.dataset.bars)||1;
  // total chars on a row: label(1) + bar(1) + cols + separators(bars-1) + trailing bar(1)
  const totalChars=cols+(bars-1)+3;
  const w=el.clientWidth-4;
  let fs=w/(totalChars*0.6); // monospace char ≈ 0.6em wide
  fs=clamp(fs,5,13);
  el.style.fontSize=fs+'px';
}

/* Keyboard + click handling for the structured grid. */
function bindTabEditor(containerId){
  const el=document.getElementById(containerId); if(!el)return;
  const ci=el.dataset.ci,bi=el.dataset.bi,type=el.dataset.type;

  // click a cell → place cursor there
  el.querySelectorAll('.tcell').forEach(cell=>{
    cell.addEventListener('mousedown',e=>{
      e.preventDefault();
      TAB_CURSOR[containerId]={col:parseInt(cell.dataset.col)};
      el.focus();
      markCursor(el,parseInt(cell.dataset.col));
    });
  });

  el.addEventListener('keydown',e=>{
    const grid=getTabGridFromBlock(ci,bi,type);
    let cur=(TAB_CURSOR[containerId]&&TAB_CURSOR[containerId].col!=null)?TAB_CURSOR[containerId].col:grid.cols.length-1;
    const labels=grid.labels;
    if(e.key==='ArrowLeft'){e.preventDefault();cur=clamp(cur-1,0,grid.cols.length-1);TAB_CURSOR[containerId]={col:cur};markCursor(el,cur);return;}
    if(e.key==='ArrowRight'){e.preventDefault();cur=clamp(cur+1,0,grid.cols.length-1);TAB_CURSOR[containerId]={col:cur};markCursor(el,cur);return;}
    // typing a fret number / technique char: write into the cell on the active string.
    if(/^[0-9xXhHpPbB/\\~().*]$/.test(e.key)){
      e.preventDefault();
      const lab=el.dataset.activeLab||labels[labels.length-1];
      if(grid.cols[cur]){grid.cols[cur][lab]=e.key;saveTabGrid(ci,bi,grid)}
      // advance cursor but never past the last column (columns are fixed by bars)
      TAB_CURSOR[containerId]={col:clamp(cur+1,0,grid.cols.length-1)};
      refreshTabEditor(containerId);
      return;
    }
    if(e.key==='Backspace'){
      e.preventDefault();
      const lab=el.dataset.activeLab||labels[labels.length-1];
      if(grid.cols[cur]) grid.cols[cur][lab]='-';
      saveTabGrid(ci,bi,grid);
      // step back so repeated backspace clears leftward
      TAB_CURSOR[containerId]={col:clamp(cur-1,0,grid.cols.length-1)};
      refreshTabEditor(containerId);
      return;
    }
  });

  // track which string-row is active (for typing) by remembering last clicked label
  el.querySelectorAll('.tcell').forEach(cell=>{
    cell.addEventListener('mousedown',()=>{ el.dataset.activeLab=cell.dataset.lab; });
  });
  el.addEventListener('paste',e=>tabPaste(e,containerId));
}

}

/* Paste: normalise into the grid, never breaking structure. */
function tabPaste(e,containerId){
  const el=document.getElementById(containerId); if(!el)return;
  const ci=el.dataset.ci,bi=el.dataset.bi,type=el.dataset.type;
  const text=(e.clipboardData||window.clipboardData).getData('text');
  if(!text)return;
  e.preventDefault();
  const norm=normalizeTabText(text,type);
  const b=STATE.song.blocks.find(x=>x.id===bi);
  if(!b.content[ci])b.content[ci]={};
  b.content[ci].tab=norm; // store as text; parseTabGrid converts on next render
  const grid=parseTabGrid(norm,type); saveTabGrid(ci,bi,grid);
  refreshTabEditor(containerId);
}

/* Chord editor: chords laid out across the block's bars, each chord
   sized proportionally to its beat-length. Bar dividers shown. Plus a
   pattern bar to save the current progression as a reusable alias and
   to apply saved patterns. */
function renderChordEditor(ch,block,data){
  ensureProgs();
  const ref={type:'block',ci:ch.id,bi:block.id};
  const chords=getChords(block,ch.id);
  const totalBeats=block.bars*sigBeats();
  const usedBeats=chords.reduce((s,c)=>s+c.beats,0);

  // Pattern bar (save / apply reusable progressions)
  const applied=(data.appliedPatterns||[]).filter(id=>STATE.song.progressions.find(p=>p.id===id));
  const available=STATE.song.progressions.filter(p=>!applied.includes(p.id));
  let patternBar=`<div class="chord-patterns"><button class="cp-save" onclick="saveProgression('${ch.id}','${block.id}')" title="Save these chords as a reusable pattern">★ Save as pattern</button>`;
  if(applied.length){applied.forEach(pid=>{const p=STATE.song.progressions.find(x=>x.id===pid);if(!p)return;patternBar+=`<span class="cp-chip"><span class="cp-chip-name" onclick="applyProgression('${ch.id}','${block.id}','${pid}')" title="Re-apply">${escapeHTML(p.name)}</span><span class="cp-chip-edit" onclick="renameProgression('${pid}')" title="Rename pattern">✎</span><span class="cp-chip-del" onclick="removePatternFromBlock('${ch.id}','${block.id}','${pid}')" title="Remove from block">×</span></span>`})}
  if(applied.length<2&&available.length){patternBar+=`<select class="cp-select" onchange="if(this.value){applyProgression('${ch.id}','${block.id}',this.value);this.value=''}"><option value="">+ Apply pattern…</option>`;available.forEach(p=>{const preview=p.chords.map(normalizeChord).map(c=>c.name).join(' ');patternBar+=`<option value="${p.id}" title="${escapeHTML(preview)}">${escapeHTML(p.name)}</option>`});patternBar+=`</select>`}
  else if(applied.length>=2){patternBar+=`<span class="cp-label" style="color:var(--ink-faint);font-size:9px">max 2 patterns</span>`}
  patternBar+=`</div>`;

  const lyCount=blockLyricLineCount(block);
  const lineCtrl=`<div class="chord-lines-toolbar">
    <span class="cl-count">Líneas: <b>${chordsToLines(chords).length}</b></span>
    <button class="cl-btn" onclick="syncChordsToLyrics('${ch.id}','${block.id}')" title="Repartir en ${lyCount} línea(s), igual que la letra">⇋ Sincronizar con letra (${lyCount})</button>
    <button class="cl-btn" onclick="gcAutoBars('${refTok(ref)}')" title="Una línea por compás">⊞ 1 compás/línea</button>
    <button class="cl-btn" onclick="gcClear('${refTok(ref)}')" title="Unir todo en una línea">⥶ Unir en 1</button>
    <span class="cl-hint">↵ corta línea · ⠿ arrastrá para mover de línea</span>
  </div>`;

  const stack=renderChordLineStack(ref,chords);
  const fillClass=usedBeats===totalBeats?'ok':(usedBeats>totalBeats?'over':'under');
  const fill=`<div class="chord-fill ${fillClass}" data-fill="${ch.id}|${block.id}">${usedBeats} / ${totalBeats} beats filled${usedBeats>totalBeats?' (over!)':usedBeats<totalBeats?' ('+(totalBeats-usedBeats)+' free)':''}</div>`;
  return patternBar+lineCtrl+stack+fill+`<textarea class="notes-area" placeholder="Strumming pattern, dynamics, notes…" oninput="setText('${ch.id}','${block.id}',this.value,'notes')">${escapeHTML(data.notes||'')}</textarea>`;
}

function renderDrumGrid(ch,block,data){const rows=['HH','SN','KK','TM','CY'],bpb=sigBeats(),sub=4,total=block.bars*bpb*sub,p=data.pattern||(data.pattern={});let h='<div class="drum-grid">';rows.forEach(r=>{if(!p[r])p[r]=new Array(total).fill(false);while(p[r].length<total)p[r].push(false);h+=`<div class="drum-row"><div class="drum-label">${r}</div><div class="drum-cells" style="grid-template-columns:repeat(${total},1fr)">`;for(let i=0;i<total;i++)h+=`<div class="drum-cell${p[r][i]?' active':''}${i%sub===0?' beat-marker':''}" data-row="${r}" data-i="${i}" data-ch="${ch.id}" data-block="${block.id}"></div>`;h+='</div></div>'});return h+'</div>'}

/* ── Render: Overview ── */
function getLyricsChannel(){
  let ch=STATE.song.channels.find(c=>c.type==='lyrics');
  if(!ch){const id=addChannel('Vocals','lyrics');ch=STATE.song.channels.find(c=>c.id===id)}
  return ch;
}

/* Dynamic, fused Overview: each block is an editable lyric line/section.
   - Blank line (double Enter) inside a block splits it into two blocks.
   - Backspace at the very start of an empty/short block merges into the previous one.
   - Pasting multi-section text auto-splits into blocks.
   Detail (chords, tabs, drums) lives in each channel's own view. */
/* ── Render: Overview (columnar — one column per channel) ──
   Each block is a row; every visible channel gets its own column
   so lyrics, chords, tabs and drums line up side by side.
   Repeated channel content (identical chords/tabs, or a saved
   pattern) is collapsed into a "repeat" badge instead of redrawing,
   while still respecting each block's bar/beat length.            */
/* ── Render: Overview (columnar, chords ABOVE lyrics) ──────
   Layout: each block is a row. The Vocals column shows the chord
   progression as a time-proportional lane ABOVE the lyric lines
   (lead-sheet style), so chords sit over the letra and span the
   same horizontal width as the paragraph. Rhythm channels are
   therefore merged into the lyrics column instead of taking their
   own column. Other instruments (lead/bass tab, drums…) keep a
   column each. Repeated chords/tabs collapse into a ↻ badge.   */
/* ── Render: Overview (per-line chords + merge/separate) ───
   Two modes (toggle in the toolbar):
   • FUSIONADO  → chords sit ABOVE each lyric line, positioned by the
                  beat where they fall (each line read as a time-bar).
   • SEPARADO   → rhythm (chords) and lyrics get their own columns.
   Chords/tabs repeated across blocks collapse into a ↻ badge.      */
function visibleOverviewChannels(){
  const hidden=STATE.ui.hiddenChannels||(STATE.ui.hiddenChannels=[]);
  return STATE.song.channels.filter(c=>!hidden.includes(c.id));
}
function ovMerged(){ if(STATE.ui.ovMerge===undefined)STATE.ui.ovMerge=false; return STATE.ui.ovMerge; }
function setOvMerge(v){ STATE.ui.ovMerge=v; STATE.ui.editingBlockId=null; renderOverview(); }
/* The single rhythm channel whose chords are placed over the lyrics. */
function primaryChordChannel(){
  return visibleOverviewChannels().find(c=>c.type==='rhythm')||null;
}
/* Columns: in merged mode rhythm is folded into lyrics; in separated mode it is its own column. */
function overviewColumnChannels(){
  const vis=visibleOverviewChannels();
  return ovMerged()? vis.filter(c=>c.type!=='rhythm') : vis;
}
function toggleOverviewChannel(id){
  const h=STATE.ui.hiddenChannels||(STATE.ui.hiddenChannels=[]);
  const i=h.indexOf(id); if(i>=0)h.splice(i,1);else h.push(id);
  renderOverview();
}
function ovColTemplate(channels){
  const cols=channels.map(c=>{
    if(c.type==='lyrics')return'minmax(300px,1.9fr)';
    if(c.type==='lead'||c.type==='bass')return'minmax(190px,1.1fr)';
    if(c.type==='rhythm')return'minmax(170px,1.1fr)';
    return'minmax(150px,1fr)';
  });
  return`108px ${cols.join(' ')} 32px`;
}

/* ── Repeat detection ── */
function channelFingerprint(block,ch){
  const c=block.content[ch.id];if(!c)return'';
  if(ch.type==='rhythm'){const cd=getChords(block,ch.id);return cd.length?('R:'+cd.map(x=>x.name+'@'+x.beats).join(',')):''}
  if(ch.type==='lead'||ch.type==='bass'){const t=normalizeTab(c.tab,tabType(ch));return /[0-9xXhHpPbB]/.test(t)?('T:'+t.replace(/\s+/g,'')):''}
  if(ch.type==='drums'){const p=c.pattern||{};const s=Object.keys(p).sort().map(k=>k+':'+(p[k]||[]).map(v=>v?1:0).join('')).join('|');return /1/.test(s)?('D:'+s):''}
  if(ch.type==='lyrics')return'';
  return c.text&&c.text.trim()?('N:'+c.text.trim()):'';
}
function buildRepeatMap(){
  const map={}; STATE.song.channels.forEach(ch=>map[ch.id]={});
  STATE.song.blocks.forEach((b,i)=>STATE.song.channels.forEach(ch=>{
    const fp=channelFingerprint(b,ch);
    if(fp && !(fp in map[ch.id]))map[ch.id][fp]={index:i};
  }));
  return map;
}
function matchingProgression(block,ch){
  if(ch.type!=='rhythm')return null; ensureProgs();
  const fp=getChords(block,ch.id).map(x=>x.name+'|'+x.beats).join(',');
  if(!fp)return null;
  return STATE.song.progressions.find(p=>p.chords.map(c=>(c.name||c)+'|'+(c.beats||sigBeats())).join(',')===fp)||null;
}
function ovBadges(block,ch,blockIndex,repeatMap){
  let b=''; const ic='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8a6 6 0 0110-4M14 8a6 6 0 01-10 4M12 1v3h-3M4 15v-3h3"/></svg>';
  if(ch.type==='rhythm'){const prog=matchingProgression(block,ch);if(prog)b+=`<span class="ov-repeat pattern" title="Patrón guardado">${ic}${escapeHTML(prog.name)}</span>`;}
  const first=repeatMap[ch.id]?.[channelFingerprint(block,ch)];
  if(first&&first.index<blockIndex)b+=`<span class="ov-repeat" title="Igual que el bloque ${first.index+1}">${ic}como #${String(first.index+1).padStart(2,'0')}</span>`;
  return b;
}

/* ── Per-line chord placement (line = time-bar) ── */
function distributeChordsToLines(block,ch){
  const total=block.bars*sigBeats();
  const lyrics=getLyricsChannel();
  const text=block.content[lyrics.id]?.text||'';
  let lines=text.length?text.split('\n'):[''];
  const n=lines.length;
  const chords=getChords(block,ch.id);
  const out=lines.map(t=>({text:t,chords:[],beatsPerLine:total/n,barsPerLine:(total/n)/sigBeats()}));

  // If the rhythm chords carry line breaks, map each chord-line to a lyric line.
  const groups=[[]]; chords.forEach((c,i)=>{groups[groups.length-1].push(c);if(c.br&&i<chords.length-1)groups.push([])});
  if(groups.length>1){
    groups.forEach((g,gi)=>{
      const li=Math.min(n-1,gi);
      const lineBeats=g.reduce((s,c)=>s+c.beats,0)||1;
      out[li].beatsPerLine=lineBeats; out[li].barsPerLine=lineBeats/sigBeats();
      let pos=0; g.forEach(c=>{out[li].chords.push({name:c.name,beats:c.beats,offset:Math.max(0,Math.min(.97,pos/lineBeats))});pos+=c.beats});
    });
    return {lines:out,beatsPerLine:total/n,total};
  }

  // Otherwise distribute evenly across the lyric lines by time.
  const bpl=total/n; let pos=0;
  const placed=chords.map(c=>{const s=pos;pos+=c.beats;return{name:c.name,beats:c.beats,start:s}});
  placed.forEach(p=>{let li=Math.min(n-1,Math.max(0,Math.floor((p.start+1e-6)/bpl)));const ls=li*bpl;out[li].chords.push({name:p.name,beats:p.beats,offset:Math.max(0,Math.min(.97,(p.start-ls)/bpl))})});
  return {lines:out,beatsPerLine:bpl,total};
}

function renderOverview(){
  ovMerged(); // ensure default

    : `<i style="font-style:normal;opacity:.7">✎</i> Rítmica y letra en <b>columnas separadas</b>. Cambia a <b>Fusionado</b> para poner los acordes encima de cada línea.`;

    hh+=`<div class="ov-ch-cell" style="--ch-color:${ch.color}"><span class="ov-ch-swatch"></span><span><span class="ov-ch-title">${escapeHTML(ch.name)}</span> <span class="ov-ch-sub">${info.label}${extra}</span></span></div>`;
  });
  hh+=`<div class="ov-ch-cell"></div>`;head.innerHTML=hh;wrap.appendChild(head);

  wrap.appendChild(makeInsertZone(0));

    wrap.appendChild(buildOverviewRow(block,i,columns,tpl,repeatMap));

  });

function renderOverviewCell(ch,block,blockIndex,repeatMap){
  if(ch.type==='lyrics') return renderLyricsCell(ch,block,blockIndex,repeatMap);

  const fp=channelFingerprint(block,ch);
  if(!fp)return`<div class="ov-cell-empty">·</div>`;
  const badges=ovBadges(block,ch,blockIndex,repeatMap);
  let body='';
  if(ch.type==='rhythm'){ body=ovChordLane(block,ch); }          // separated mode column
  else if(ch.type==='lead'||ch.type==='bass'){ body=`<div class="ov-tab">${escapeHTML(normalizeTab(block.content[ch.id].tab,tabType(ch)))}</div>`; }
  else if(ch.type==='drums'){ body=ovDrumMini(block,ch); }
  else { body=`<div class="ov-notes">${escapeHTML(block.content[ch.id].text||'')}</div>`; }
  return badges+body;
}

/* The lyrics cell: editable textarea, OR (merged + not editing) per-line chord display. */
function renderLyricsCell(ch,block,blockIndex,repeatMap){
  const lt=block.content[ch.id]?.text||'';
  const editing=STATE.ui.editingBlockId===block.id;
  const chordCh=primaryChordChannel();

  if(!ovMerged() || editing){
    const lanes=(ovMerged()&&editing&&chordCh)? '' : ''; // (chords hidden while typing)
    return`${lanes}<textarea class="ov-lyric-edit" data-block-id="${block.id}" placeholder="Letra del bloque… (línea en blanco = nuevo bloque)"
      oninput="onOverviewLyricInput(event,'${block.id}','${ch.id}')"
      onkeydown="onOverviewLyricKey(event,'${block.id}','${ch.id}')"
      onpaste="onOverviewLyricPaste(event,'${block.id}','${ch.id}')"
      ${ovMerged()?`onblur="onLyricBlur(event)"`:''}>${escapeHTML(lt)}</textarea>`;
  }

  // Merged display: chords above each line.
  const badges=chordCh?ovBadges(block,chordCh,blockIndex,repeatMap):'';
  let body='';
  if(chordCh){
    const {lines}=distributeChordsToLines(block,chordCh);
    body=lines.map(ln=>ovLineHTML(ln)).join('');
  }else{
    // no chords → still editable lines
    const arr=lt.length?lt.split('\n'):[''];
    body=arr.map(t=>ovLineHTML({text:t,chords:[],beatsPerLine:0,barsPerLine:0})).join('');
  }
  return`<div class="ov-lyrics-disp" onclick="startEditLyrics('${block.id}')" title="Clic para editar">${badges?`<div class="ov-lc-badges">${badges}</div>`:''}${body}</div>`;
}

/* One lyric line with its chords positioned by beat over a time-bar. */
function ovLineHTML(ln){
  const bpl=ln.beatsPerLine||0;
  const hasChords=ln.chords&&ln.chords.length;
  let chordRow='';
  if(hasChords||bpl){
    let ticks='';
    if(bpl){
      const beats=Math.round(bpl); const sb=sigBeats();
      for(let k=0;k<beats;k++){const left=(k/bpl)*100;ticks+=`<span class="ov-ln-tick${k%sb===0?' bar':''}" style="left:${left}%"></span>`}
    }
    const chords=(ln.chords||[]).map(c=>`<span class="ov-ln-chord" style="left:${(c.offset*100).toFixed(2)}%">${escapeHTML(c.name)}<span class="bt">${c.beats}b</span></span>`).join('');
    chordRow=`<div class="ov-ln-chords">${ticks}${chords}</div>`;
  }
  const txt=ln.text&&ln.text.trim()?escapeHTML(ln.text):'<span class="empty">Letra…</span>';
  return`<div class="ov-ln">${chordRow}<div class="ov-ln-text">${txt}</div></div>`;
}

/* Proportional chord lane (used by the separated-mode rhythm column). */
function ovChordLane(block,ch){
  const chords=getChords(block,ch.id);
  if(!chords.length)return`<div class="ov-cell-empty">·</div>`;
  const lane=chords.map(c=>`<div class="ov-chord-cell" style="flex-grow:${c.beats};flex-shrink:1;flex-basis:0"><span class="nm">${escapeHTML(c.name)}</span><span class="bt">${c.beats}b</span></div>`).join('');
  let ticks='<div class="ov-bar-ticks">';for(let b=0;b<block.bars;b++)ticks+='<div class="ov-bar-tick"></div>';ticks+='</div>';
  return`<div class="ov-chord-lane">${lane}</div>${ticks}`;
}
function ovDrumMini(block,ch){
  const p=block.content[ch.id]?.pattern||{};const rows=['HH','SN','KK','TM','CY'];
  const total=block.bars*sigBeats()*4,step=Math.max(1,Math.floor(total/24));
  let h='<div class="ov-drum" style="--ch-color:'+ch.color+'">';
  rows.forEach(r=>{const a=p[r]||[];h+=`<div class="ov-drum-row"><span class="ov-drum-lab">${r}</span><div class="ov-drum-dots">`;for(let i=0;i<total;i+=step)h+=`<div class="ov-drum-dot${a[i]?' on':''}"></div>`;h+='</div></div>'});
  return h+'</div>';
}

/* Auto-grow the textarea and persist text as you type. */
function onOverviewLyricInput(e,blockId,lyricsChId){
  const ta=e.target;
  setText(lyricsChId,blockId,ta.value);
  autoGrow(ta);
  updateOverviewStats();
}

function autoGrow(ta){
  ta.style.height='auto';
  ta.style.height=Math.max(48,ta.scrollHeight)+'px';
}

/* Key handling: blank line splits, backspace-at-start merges. */
function onOverviewLyricKey(e,blockId,lyricsChId){
  const ta=e.target;
  const idx=STATE.song.blocks.findIndex(b=>b.id===blockId);

  // ENTER: if it would create a blank line (previous char is newline or empty),
  // split the block at the cursor instead.
  if(e.key==='Enter'){
    const pos=ta.selectionStart;
    const before=ta.value.slice(0,pos);
    const after=ta.value.slice(pos);
    // Blank line = cursor right after an existing newline, or at end after newline
    const endsWithNewline=/\n\s*$/.test(before);
    if(endsWithNewline){
      e.preventDefault();
      // Text for current block = before (trimmed of trailing newlines)
      const keep=before.replace(/\n\s*$/,'');
      const moved=after.replace(/^\s*\n/,'');
      setText(lyricsChId,blockId,keep);
      // Create a new block right after, carrying the rest of the text
      const newId=insertBlockAfter(idx,STATE.song.blocks[idx].section);
      setText(lyricsChId,newId,moved);
      if(ovMerged())STATE.ui.editingBlockId=newId;
      renderOverview();
      // focus the new block at start
      requestAnimationFrame(()=>{
        const nt=document.querySelector(`textarea[data-block-id="${newId}"]`);
        if(nt){nt.focus();nt.setSelectionRange(0,0);autoGrow(nt)}
      });
      return;
    }
  }

  // BACKSPACE at very start of a block → merge into previous block
  if(e.key==='Backspace' && ta.selectionStart===0 && ta.selectionEnd===0){
    if(idx>0){
      e.preventDefault();
      const prev=STATE.song.blocks[idx-1];
      const prevText=prev.content[lyricsChId]?.text||'';
      const curText=ta.value;
      const mergedPos=prevText.length;
      const merged=prevText+(prevText&&curText?'\n':'')+curText;
      setText(lyricsChId,prev.id,merged);
      // remove current block
      STATE.song.blocks.splice(idx,1);
      if(ovMerged())STATE.ui.editingBlockId=prev.id;
      renderOverview();
      requestAnimationFrame(()=>{
        const pt=document.querySelector(`textarea[data-block-id="${prev.id}"]`);
        if(pt){pt.focus();pt.setSelectionRange(mergedPos,mergedPos);autoGrow(pt)}
      });
      return;
    }
  }
}

/* Paste multi-section text → split into blocks at blank lines. */
function onOverviewLyricPaste(e,blockId,lyricsChId){
  const text=(e.clipboardData||window.clipboardData).getData('text');
  if(!text||!/\n\s*\n/.test(text)) return; // single section → default paste
  e.preventDefault();
  const ta=e.target;
  const idx=STATE.song.blocks.findIndex(b=>b.id===blockId);
  const before=ta.value.slice(0,ta.selectionStart);
  const after=ta.value.slice(ta.selectionEnd);

  // Sections from the pasted content
  const sections=parseLyricsSections(text);
  // First section merges into current block's existing text-before
  const firstText=(before+sections[0]).trim();
  setText(lyricsChId,blockId,firstText);
  STATE.song.blocks[idx].section=guessSec(sections[0]);

  let insertAt=idx;
  let lastId=blockId;
  for(let s=1;s<sections.length;s++){
    const newId=insertBlockAfter(insertAt,guessSec(sections[s]));
    let txt=sections[s];
    if(s===sections.length-1) txt=txt+(after?'\n'+after:'');
    setText(lyricsChId,newId,txt.trim());
    insertAt++;lastId=newId;
  }
  if(ovMerged())STATE.ui.editingBlockId=lastId;
  renderOverview();
  requestAnimationFrame(()=>{
    const lt=document.querySelector(`textarea[data-block-id="${lastId}"]`);
    if(lt){lt.focus();autoGrow(lt)}
  });
  flash(sections.length+' blocks from paste');
}

/* Insert a fresh block right after index `afterIdx`, return its id. */
function insertBlockAfter(afterIdx,section='VERSE'){
  const bl={id:uid(),section:section||'VERSE',bars:4,enabled:true,comment:'',content:{}};
  STATE.song.channels.forEach(c=>{bl.content[c.id]=defaultContent(c.type)});
  STATE.song.blocks.splice(afterIdx+1,0,bl);
  return bl.id;
}

/* Delete a block but, if it has lyrics, merge them up so nothing is lost silently. */
function deleteBlockKeepText(blockId){
  const idx=STATE.song.blocks.findIndex(b=>b.id===blockId);
  if(idx===-1)return;
  const lyricsCh=getLyricsChannel();
  const txt=(STATE.song.blocks[idx].content[lyricsCh.id]?.text||'').trim();
  if(txt && !confirm('Delete this block and its lyrics?')) return;
  STATE.song.blocks.splice(idx,1);
  if(!STATE.song.blocks.length) addBlock('VERSE',4);
  renderOverview();
}

function updateOverviewStats(){
  const el=document.getElementById('ovStats');
  if(!el)return;
  const n=STATE.song.blocks.length;
  const totalBeats=STATE.song.blocks.reduce((s,b)=>s+(b.enabled?b.bars*sigBeats():0),0);
  el.textContent=`${n} block${n===1?'':'s'} · ${totalBeats} beats`;
}

const TL_BW=220;
function renderTimeline(){

function renderTLCell(ch,block){const data=block.content[ch.id]||defaultContent(ch.type);switch(ch.type){
case'lyrics':{const t=data.text||'';return t?`<div class="tl-cell-lyric">${escapeHTML(t)}</div>`:'<div class="tl-cell-lyric empty">···</div>'}
case'rhythm':{const c=(data.chords||[]).map(normalizeChord),n=data.notes||'';let r='';if(c.length)r+=`<div class="tl-cell-chords">${c.map(x=>`<span class="tl-cell-chord">${escapeHTML(x.name)}</span>`).join('')}</div>`;if(n.trim())r+=`<div class="tl-cell-notes" style="margin-top:3px">${escapeHTML(n.substring(0,100))}</div>`;return r||'<div class="tl-cell-lyric empty">···</div>'}
case'lead':case'bass':{const tt=tabType(ch);const isEmpty=!data.tab||(typeof data.tab==='string'&&(data.tab===''||data.tab===defaultTab(ch.type)));const txt=data.tab?normalizeTab(data.tab,tt):'';const hasNotes=txt&&/[0-9xXhHpPbB]/.test(txt);return hasNotes?`<div class="tl-cell-tab">${escapeHTML(txt)}</div>`:'<div class="tl-cell-lyric empty">···</div>'}
case'drums':{const p=data.pattern||{},rows=['HH','SN','KK','TM','CY'],total=block.bars*sigBeats()*4,step=Math.max(1,Math.floor(total/28));let r='<div class="tl-cell-drum">';rows.forEach(x=>{const a=p[x]||[];r+='<div class="tl-drum-row">';for(let i=0;i<total;i+=step)r+=`<div class="tl-drum-dot${a[i]?' on':''}"></div>`;r+='</div>'});return r+'</div>'}
default:{const t=data.text||'';return t.trim()?`<div class="tl-cell-notes">${escapeHTML(t.substring(0,130))}</div>`:'<div class="tl-cell-lyric empty">···</div>'}}}
function updateTLPlayhead(){const ph=$('#tlPlayhead');if(!ph)return;if(!STATE.ui.isPlaying){ph.style.display='none';return}const bd=$('#tlBody');if(!bd)return;ph.style.display='block';ph.style.left=(136+STATE.ui.currentBlockIndex*TL_BW+STATE.ui.blockProgress*TL_BW-bd.scrollLeft)+'px'}

/* ── Audio / Metronome ── */
let audioCtx=null;
function ensureAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return false}if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return true}
function clickSound(a){if(!audioCtx||audioCtx.state!=='running')return;try{const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.setValueAtTime(a?1500:900,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a?.35:.22,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+.06);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.07)}catch(e){}}
function renderBeatLeds(){const n=sigBeats(),r=$('#beatLeds');r.innerHTML='';for(let i=0;i<n;i++){const l=document.createElement('div');l.className='led'+(i===0?' downbeat':'');r.appendChild(l)}}
function lightBeat(b){$$('#beatLeds .led').forEach((l,i)=>l.classList.toggle('on',i===b))}
function togglePlay(){STATE.ui.isPlaying?pausePlayback():startPlayback()}
function startPlayback(){ensureAudio();STATE.ui.isPlaying=true;STATE.ui.blockProgress=0;$('#playBtn').classList.add('active');$('#playIcon').innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';if(STATE.ui.countIn>0){STATE.ui.isCountingIn=true;STATE.ui.countInBeatsLeft=STATE.ui.countIn*sigBeats();startCountIn()}else{STATE.ui.isCountingIn=false;startMetronome()}}
function startCountIn(){const iv=60000/STATE.song.bpm,bpb=sigBeats(),tot=STATE.ui.countInBeatsLeft;function tick(){if(STATE.ui.countInBeatsLeft<=0){clearInterval(STATE.ui.metronomeTimer);STATE.ui.isCountingIn=false;startMetronome();return}const b=(tot-STATE.ui.countInBeatsLeft)%bpb;clickSound(b===0);lightBeat(b);STATE.ui.countInBeatsLeft--}tick();STATE.ui.metronomeTimer=setInterval(tick,iv)}
function pausePlayback(){STATE.ui.isPlaying=false;STATE.ui.isCountingIn=false;STATE.ui.blockProgress=0;$('#playBtn').classList.remove('active');$('#playIcon').innerHTML='<path d="M8 5v14l11-7z"/>';if(STATE.ui.metronomeTimer)clearInterval(STATE.ui.metronomeTimer);STATE.ui.metronomeTimer=null;$$('#beatLeds .led').forEach(l=>l.classList.remove('on'));$$('.chord-slot.chord-active').forEach(s=>s.classList.remove('chord-active'));renderEditor()}
function stopPlayback(){pausePlayback();STATE.ui.currentBlockIndex=0;STATE.ui.currentBeat=0;STATE.ui.blockProgress=0;renderEditor()}
function restartMetronome(){if(STATE.ui.metronomeTimer)clearInterval(STATE.ui.metronomeTimer);startMetronome()}
function startMetronome(){const iv=60000/STATE.song.bpm,bpb=sigBeats();function tick(){const block=STATE.song.blocks[STATE.ui.currentBlockIndex];if(!block){stopPlayback();return}if(!block.enabled){STATE.ui.currentBlockIndex++;STATE.ui.currentBeat=0;STATE.ui.blockProgress=0;if(STATE.ui.currentBlockIndex>=STATE.song.blocks.length){stopPlayback();return}renderEditor();scrollToCurrentBlock();return}const tot=block.bars*bpb;clickSound(STATE.ui.currentBeat===0);lightBeat(STATE.ui.currentBeat%bpb);const tp=(STATE.ui.currentBeat+1)/tot;if(STATE.ui.currentBeat===0){STATE.ui.blockProgress=0;renderEditor();scrollToCurrentBlock();requestAnimationFrame(()=>requestAnimationFrame(()=>{STATE.ui.blockProgress=tp;updateProgressBar()}))}else{STATE.ui.blockProgress=tp;updateProgressBar()}updateTLPlayhead();STATE.ui.currentBeat++;if(STATE.ui.currentBeat>=tot){STATE.ui.currentBeat=0;STATE.ui.blockProgress=0;STATE.ui.currentBlockIndex++;if(STATE.ui.currentBlockIndex>=STATE.song.blocks.length)stopPlayback()}}tick();STATE.ui.metronomeTimer=setInterval(tick,iv)}
function updateProgressBar(){
  const block=STATE.song.blocks[STATE.ui.currentBlockIndex];if(!block)return;
  const el=document.querySelector(`[data-block-id="${block.id}"] .block-progress`);
  if(el){const bs=(60/STATE.song.bpm).toFixed(3);el.style.transition=`width ${bs}s linear`;el.style.width=(STATE.ui.blockProgress*100)+'%'}
  const beatPos=STATE.ui.blockProgress*block.bars*sigBeats();
  STATE.song.channels.forEach(ch=>{
    if(ch.type!=='rhythm')return;
    const cont=document.querySelector(`.chord-slots[data-block="${block.id}"][data-ch="${ch.id}"]`);
    if(!cont)return;
    const chords=getChords(block,ch.id);if(!chords.length)return;
    let acc=0,active=chords.length-1;
    for(let i=0;i<chords.length;i++){acc+=chords[i].beats;if(beatPos<acc){active=i;break}}
    cont.querySelectorAll('.chord-slot').forEach((s,k)=>s.classList.toggle('chord-active',k===active));
  });
}
function scrollToCurrentBlock(){if(!STATE.ui.autoScroll)return;const block=STATE.song.blocks[STATE.ui.currentBlockIndex];if(!block)return;if(STATE.ui.view==='timeline'){const bd=$('#tlBody');if(bd){const off=STATE.ui.currentBlockIndex*TL_BW,vw=bd.clientWidth-136;if(off<bd.scrollLeft||off>bd.scrollLeft+vw-TL_BW)bd.scrollTo({left:Math.max(0,off-vw/3),behavior:'smooth'})}return}const el=document.querySelector(`[data-block-id="${block.id}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}
function adjustBpm(d){STATE.song.bpm=clamp(STATE.song.bpm+d,20,300);$('#bpmInput').value=STATE.song.bpm;if(STATE.ui.isPlaying)restartMetronome();renderEditor()}
function toggleAutoScroll(){STATE.ui.autoScroll=!STATE.ui.autoScroll;$('#autoScroll').classList.toggle('on',STATE.ui.autoScroll)}

/* ═══════════════════════════════════════════════════════════════
   READING MODE · ChordPro lead sheet
   A songbook-style view: section headers with bar count + mm:ss
   timing derived from the tempo, chords anchored to a character
   point in each lyric line. Editable as plain text and saved back
   into the block model (lyrics + rhythm chords + per-block chordpro).
   ═══════════════════════════════════════════════════════════════ */
function fmtTime(sec){const m=Math.floor(sec/60),s=Math.round(sec%60);return m+':'+String(s).padStart(2,'0')}
function secPerBeat(){return 60/(STATE.song.bpm||120)}
function totalDur(){return STATE.song.blocks.reduce((t,b)=>t+(b.enabled?b.bars*sigBeats()*secPerBeat():0),0)}

/* Even integer beat distribution that sums to `total`. */
function distributeBeat(total,n,k){const base=Math.floor(total/n),rem=total-base*n;return base+(k<rem?1:0)}

/* Build the ChordPro lines for a block (use saved chordpro, else synthesize). */
function blockToChordProLines(block,fresh){
  if(!fresh && block.chordpro!=null && block.chordpro!=='') return block.chordpro;
  const ly=getLyricsChannel();
  const text=block.content[ly.id]?.text||'';
  const rh=STATE.song.channels.find(c=>c.type==='rhythm');
  const chords=rh?getChords(block,rh.id):[];
  const lines=text.length?text.split('\n'):[''];
  if(!chords.length) return lines.join('\n');
  const per=Math.ceil(chords.length/lines.length);
  let ci=0;
  const out=lines.map(ln=>{const grp=chords.slice(ci,ci+per);ci+=per;return grp.map(c=>`[${c.name}]`).join('')+ln});
  if(ci<chords.length)out[out.length-1]+=chords.slice(ci).map(c=>`[${c.name}]`).join('');
  return out.join('\n');
}

/* Whole-song ChordPro source. */
function songToChordPro(fresh){
  const s=STATE.song;
  let out=`{title: ${s.title||''}}\n{artist: ${s.artist||''}}\n{bpm: ${s.bpm}}\n{signature: ${s.signature}}\n`;
  s.blocks.forEach(b=>{out+=`\n[${b.section} x${b.bars}]\n`+blockToChordProLines(b,fresh)+'\n'});
  return out.trim()+'\n';
}

/* Parse ChordPro source → metadata + blocks [{section,bars,lines[]}]. */
function chordProToBlocks(text){
  const lines=text.replace(/\r/g,'').split('\n');
  const blocks=[],meta={};let cur=null;
  for(const line of lines){
    const mMeta=line.match(/^\{(\w+):\s*(.*)\}\s*$/);
    if(mMeta){meta[mMeta[1].toLowerCase()]=mMeta[2].trim();continue}
    // Section header: a lone [NAME] or [NAME x9]; must be a single bracket pair (no inner "][").
    const mSec=line.match(/^\[([^\]\[]+?)\]\s*$/);
    if(mSec && !/\]\s*\[/.test(line)){
      const inner=mSec[1].trim();
      const xm=inner.match(/^(.*?)\s*x\s*(\d+)\s*$/i);
      const name=(xm?xm[1]:inner).trim();
      cur={section:name.toUpperCase(),bars:xm?parseInt(xm[2]):null,lines:[]};
      blocks.push(cur);continue;
    }
    if(line.trim()===''){continue}        // blank lines are separators (headers delimit blocks)
    if(!cur){cur={section:'VERSE',bars:null,lines:[]};blocks.push(cur)}
    cur.lines.push(line);
  }
  return {meta,blocks};
}

/* Save edited ChordPro back into the song model. */
function saveChordPro(text){
  const {meta,blocks:parsed}=chordProToBlocks(text);
  if(meta.title!=null)STATE.song.title=meta.title;
  if(meta.artist!=null)STATE.song.artist=meta.artist;
  if(meta.bpm)STATE.song.bpm=parseInt(meta.bpm)||STATE.song.bpm;
  if(meta.signature)STATE.song.signature=meta.signature;
  if(!parsed.length){flash('Nada que guardar');return}

  const ly=getLyricsChannel();
  let rh=STATE.song.channels.find(c=>c.type==='rhythm');
  const anyChords=parsed.some(b=>b.lines.some(l=>/\[[^\]]+\]/.test(l)));
  if(!rh && anyChords){const id=addChannel('Ritmica','rhythm');rh=STATE.song.channels.find(c=>c.id===id)}

  while(STATE.song.blocks.length<parsed.length)insertBlockAfter(STATE.song.blocks.length-1,'VERSE');
  while(STATE.song.blocks.length>parsed.length)STATE.song.blocks.pop();

  parsed.forEach((p,i)=>{
    const b=STATE.song.blocks[i];
    if(p.section)b.section=p.section;
    if(p.bars)b.bars=Math.max(1,Math.min(64,p.bars));
    const names=[];
    const stripped=p.lines.map(l=>l.replace(/\[([^\]]+)\]/g,(_,c)=>{names.push(c.trim());return''}));
    b.chordpro=p.lines.join('\n');
    if(!b.content[ly.id])b.content[ly.id]={};
    b.content[ly.id].text=stripped.join('\n').replace(/[ \t]+$/gm,'');
    if(rh){
      if(!b.content[rh.id])b.content[rh.id]=defaultContent('rhythm');
      const total=b.bars*sigBeats(),n=names.length;
      b.content[rh.id].chords=n?names.map((nm,k)=>({name:nm,beats:distributeBeat(total,n,k)})):[];
      b.content[rh.id].notes=b.content[rh.id].notes||'';
    }
  });
  renderAll();
  flash('Lead sheet guardado');
}
function saveChordProFromEditor(){const t=$('#rdSource');if(t)saveChordPro(t.value)}
function regenChordPro(){const t=$('#rdSource');if(t)t.value=songToChordPro(true)}

/* ── Lead-sheet preview (chords anchored to lyric characters) ── */
function rdLineHTML(line){
  let stripped='';const chords=[];let last=0,m;const re=/\[([^\]]+)\]/g;
  while((m=re.exec(line))){stripped+=line.slice(last,m.index);chords.push({name:m[1].trim(),pos:stripped.length});last=m.index+m[0].length}
  stripped+=line.slice(last);
  const chordRow=chords.map(c=>`<span class="rd-chord" style="left:${c.pos}ch">${escapeHTML(c.name)}</span>`).join('');
  const txt=stripped.length?escapeHTML(stripped):'&nbsp;';
  return`<div class="rd-line"><div class="rd-chordrow">${chordRow}</div><div class="rd-text">${txt}</div></div>`;
}
function renderLeadSheet(){
  const s=STATE.song,spb=secPerBeat();let t=0;
  let html=`<div class="rd-meta"><h3>${escapeHTML(s.artist||'—')} — ${escapeHTML(s.title||'Sin título')}</h3>`+
           `<div class="rd-sub">${s.bpm} bpm · ${escapeHTML(s.signature)} · ${fmtTime(totalDur())} total</div></div>`;
  s.blocks.forEach(b=>{
    const beats=b.bars*sigBeats(),dur=beats*spb,start=t;if(b.enabled)t+=dur;
    const src=blockToChordProLines(b);
    html+=`<div class="rd-block${b.enabled?'':' muted'}">`+
      `<div class="rd-sec"><span class="rd-sec-tag" style="background:${SECTION_COLORS[b.section]||'#888'}">${escapeHTML(b.section)}</span>`+
      `<span class="rd-sec-meta">${b.bars} bars · ${fmtTime(start)}–${fmtTime(start+dur)}</span></div>`+
      src.split('\n').map(rdLineHTML).join('')+
    `</div>`;
  });
  return html;
}

function renderReading(){
  $('#editorHead').innerHTML=
    `<div class="editor-title"><span class="editor-title-tag" style="background:var(--accent-bg);color:var(--accent)">Lectura</span><h2>${escapeHTML(STATE.song.title)||'Untitled'}</h2></div>`+
    `<div style="display:flex;gap:8px;align-items:center"><span style="font-size:10px;color:var(--ink-faint)">${STATE.song.bpm} bpm · ${escapeHTML(STATE.song.signature)} · ${fmtTime(totalDur())}</span></div>`;
