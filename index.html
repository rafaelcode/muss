      </div>
    </div>`;
}

/* ════════════════════════════════════════════════════════════════
   CHORD LINE ENGINE (shared by block-rhythm editor and pattern editor)
   - Lines can hold N bars (group n bars per line)
   - Add / remove line-paragraphs of N bars, validated against a max
   - Drag a chord to another line (incl. the line below)
   - Resize a chord to occupy >1 bar (e.g. 1.5 bars), validated by max
   A "ref" identifies the target: {type:'block',ci,bi} or {type:'prog',progId}
   ════════════════════════════════════════════════════════════════ */
const round2=x=>Math.round(x*2)/2;
function refTok(ref){return ref.type==='block'?`b|${ref.ci}|${ref.bi}`:`p|${ref.progId}`}
function parseRef(tok){const a=tok.split('|');return a[0]==='b'?{type:'block',ci:a[1],bi:a[2]}:{type:'prog',progId:a[1]}}
function refEq(a,b){return a&&b&&a.type===b.type&&(a.type==='prog'?a.progId===b.progId:(a.ci===b.ci&&a.bi===b.bi))}
function refFromContainer(el){const c=el.closest&&el.closest('.chord-slots');if(!c)return null;if(c.dataset.prog)return{type:'prog',progId:c.dataset.prog};if(c.dataset.ch&&c.dataset.block)return{type:'block',ci:c.dataset.ch,bi:c.dataset.block};return null}
/* Stable accessor: returns the live stored chord array (objects), normalizing strings once. */
function refGet(ref){
  const bpb=sigBeats();
  if(ref.type==='block'){
    const b=STATE.song.blocks.find(x=>x.id===ref.bi);if(!b)return[];
    if(!b.content[ref.ci])b.content[ref.ci]={chords:[],notes:''};
    if(!Array.isArray(b.content[ref.ci].chords))b.content[ref.ci].chords=[];
    let changed=false;const a=b.content[ref.ci].chords.map(c=>typeof c==='string'?(changed=true,{name:c,beats:bpb}):c);
    if(changed)b.content[ref.ci].chords=a;return b.content[ref.ci].chords;
  }
  ensureProgs();const p=STATE.song.progressions.find(x=>x.id===ref.progId);if(!p)return[];
  let changed=false;const a=p.chords.map(c=>typeof c==='string'?(changed=true,{name:c,beats:bpb}):c);if(changed)p.chords=a;return p.chords;
}
function refWrite(ref,arr){
  if(ref.type==='block'){const b=STATE.song.blocks.find(x=>x.id===ref.bi);if(b){if(!b.content[ref.ci])b.content[ref.ci]={chords:[],notes:''};b.content[ref.ci].chords=arr}}
  else{const p=STATE.song.progressions.find(x=>x.id===ref.progId);if(p)p.chords=arr}
}
function refMaxBeats(ref){const bpb=sigBeats();if(ref.type==='block'){const b=STATE.song.blocks.find(x=>x.id===ref.bi);return b?b.bars*bpb:bpb}return 32*bpb}
function refCommit(ref){if(ref.type==='prog')propagateProgBreaks(ref.progId);renderEditor()}

function chordsToLines(arr){const L=[[]];arr.forEach((c,i)=>{L[L.length-1].push(c);if(c.br&&i<arr.length-1)L.push([])});return L}
function linesToChords(lines){const out=[];lines.forEach((ln,li)=>{ln.forEach(c=>{if(c&&typeof c==='object')delete c.br;out.push(c)});if(li<lines.length-1&&out.length){const last=out[out.length-1];if(last&&typeof last==='object')last.br=true}});return out}

function updateChordFill(ref){
  const bpb=sigBeats();const arr=refGet(ref);const used=arr.reduce((s,c)=>s+(c.beats||bpb),0);
  if(ref.type==='block'){
    const total=refMaxBeats(ref);
    const fEl=document.querySelector(`.chord-fill[data-fill="${ref.ci}|${ref.bi}"]`);
    if(fEl){const fc=used===total?'ok':used>total?'over':'under';fEl.className=`chord-fill ${fc}`;fEl.textContent=`${used} / ${total} beats filled${used>total?' (over!)':used<total?' ('+(total-used)+' free)':''}`}
  } else { const fEl=document.getElementById('pfill_'+ref.progId);if(fEl)fEl.textContent=used+' beats total'; }
}

/* ── Generic chord ops (called from inline handlers via token) ── */
function gcAddChord(tok){const ref=parseRef(tok);const arr=refGet(ref);arr.push({name:'C',beats:sigBeats()});refWrite(ref,arr);refCommit(ref)}
function gcUpdateName(tok,idx,text){const ref=parseRef(tok);const arr=refGet(ref);text=text.trim();if(!text){arr.splice(idx,1);refWrite(ref,arr);refCommit(ref);return}if(arr[idx])arr[idx].name=text;refWrite(ref,arr)}
function gcToggleBreak(tok,i){
  const ref=parseRef(tok);const bpb=sigBeats();const ch=refGet(ref);if(!ch[i])return;
  if(ch[i].br){delete ch[i].br;}
  else{
    let s=0;for(let k=i-1;k>=0;k--){if(ch[k].br){s=k+1;break}}
    const lb=ch.slice(s,i+1).reduce((a,c)=>a+(c.beats||bpb),0);
    let e=ch.length-1;for(let k=i+1;k<ch.length;k++){if(ch[k].br){e=k;break}}
    const nb=ch.slice(i+1,e+1).reduce((a,c)=>a+(c.beats||bpb),0);
    if(lb<bpb || (i<ch.length-1 && nb<bpb)){flash('Cada línea debe tener al menos 1 compás');return}
    ch[i].br=true;
  }
  refWrite(ref,ch);refCommit(ref);
}
function gcClear(tok){const ref=parseRef(tok);const a=refGet(ref);a.forEach(c=>delete c.br);refWrite(ref,a);refCommit(ref)}
function gcAutoBars(tok){
  const ref=parseRef(tok);const bpb=sigBeats();const a=refGet(ref);let acc=0;
  a.forEach(c=>delete c.br);
  a.forEach((c,i)=>{acc+=(c.beats||bpb);if(acc>=bpb-1e-6 && i<a.length-1){c.br=true;acc=0}});
  refWrite(ref,a);refCommit(ref);flash('Líneas de 1 compás');
}
/* Add a paragraph (line) of N bars — validated against the max. */
function gcAddLine(tok,n){
  const ref=parseRef(tok);const bpb=sigBeats();n=Math.max(1,parseInt(n)||1);
  const arr=refGet(ref);const total=arr.reduce((s,c)=>s+(c.beats||bpb),0);const add=n*bpb;
  if(total+add>refMaxBeats(ref)+1e-6){flash(`Máximo ${Math.round(refMaxBeats(ref)/bpb)} compases`);return}
  if(arr.length)arr[arr.length-1].br=true;
  arr.push({name:'C',beats:add});            // one chord spanning N bars (resize/split later)
  refWrite(ref,arr);refCommit(ref);
}
function gcRemoveLine(tok,li){
  const ref=parseRef(tok);const arr=refGet(ref);const lines=chordsToLines(arr);
  if(li<0||li>=lines.length)return;lines.splice(li,1);
  refWrite(ref,linesToChords(lines));refCommit(ref);
}
/* Move a chord (by global index) to another line + position (drag-and-drop). */
function moveChordAcross(ref,fromIdx,toLine,toPos){
  const arr=refGet(ref);const lines=chordsToLines(arr);
  let si=-1,sj=-1,idx=0;
  for(let i=0;i<lines.length&&si<0;i++)for(let j=0;j<lines[i].length;j++){if(idx===fromIdx){si=i;sj=j;break}idx++}
  if(si<0)return;
  const [m]=lines[si].splice(sj,1);
  if(lines[si].length===0){lines.splice(si,1);if(toLine>si)toLine--;}
  if(!lines.length)lines.push([]);
  const tl=Math.max(0,Math.min(lines.length-1,toLine));
  const pos=Math.max(0,Math.min(lines[tl].length,toPos));
  lines[tl].splice(pos,0,m);
  refWrite(ref,linesToChords(lines));refCommit(ref);
}

/* ── Shared line-stack renderer ── */
function renderChordLineStack(ref,chords){
  const bpb=sigBeats();const tok=refTok(ref);const inputId='addbars_'+tok.replace(/\|/g,'_');
  const lines=chordsToLines(chords);
  const dataAttrs=ref.type==='prog'?`data-prog="${ref.progId}"`:`data-ch="${ref.ci}" data-block="${ref.bi}"`;
  let stack='<div class="chord-line-stack">';let g=0;
  lines.forEach((ln,li)=>{
    const lineBeats=ln.reduce((s,c)=>s+(c.beats||bpb),0)||bpb;
    const barCount=Math.max(1,Math.round(lineBeats/bpb));
    stack+=`<div class="chord-line"><div class="chord-line-head"><span class="chord-line-label">L${li+1}</span><span class="chord-line-beats">${lineBeats}b · ${barCount} bar${barCount!==1?'s':''}</span>${lines.length>1?`<button class="cl-line-del" onclick="gcRemoveLine('${tok}',${li})" title="Eliminar esta línea">×</button>`:''}</div>`;
    stack+=`<div class="pattern-timeline-wrap"><div class="pattern-bar-ruler">`;
    let drawn=0,barN=1;while(drawn<lineBeats-1e-3){const cell=Math.min(bpb,lineBeats-drawn);stack+=`<div class="pattern-bar-cell" style="flex:${cell}"><span class="pattern-bar-num">${barN}</span></div>`;drawn+=cell;barN++}
    stack+=`</div><div class="chord-slots pattern-slots-inner" ${dataAttrs} data-line="${li}" data-linebeats="${lineBeats}">`;
    ln.forEach((c,pos)=>{
      const i=g++;
      stack+=`<div class="chord-slot" data-idx="${i}" data-line="${li}" data-linepos="${pos}" draggable="false" style="flex-grow:${c.beats};flex-shrink:1;flex-basis:0">
        <button class="chord-grip" title="Arrastrar para mover de línea / reordenar">⠿</button>
        <button class="chord-break-btn${c.br?' on':''}" onclick="gcToggleBreak('${tok}',${i})" title="${c.br?'Quitar salto de línea':'Salto de línea (mín. 1 compás)'}">↵</button>
        <div class="chord-name" contenteditable onblur="gcUpdateName('${tok}',${i},this.textContent)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${escapeHTML(c.name)}</div>
        <span class="chord-beats">${c.beats}b</span>
        <div class="chord-resize" data-idx="${i}" title="Redimensionar (puede ocupar más de 1 compás)"></div>
      </div>`;
    });
    if(li===lines.length-1)stack+=`<button class="chord-add-slot" onclick="gcAddChord('${tok}')" title="Agregar acorde">+</button>`;
    stack+=`</div></div></div>`;
  });
  const maxBars=Math.round(refMaxBeats(ref)/bpb);
  const usedBars=Math.round(chords.reduce((s,c)=>s+(c.beats||bpb),0)/bpb*10)/10;
  stack+=`<div class="cl-addline"><span class="cl-addline-lbl">Agregar línea de</span><input type="number" min="1" max="${maxBars}" value="1" class="cl-bars-input" id="${inputId}"><span class="cl-addline-lbl">compás(es)</span><button class="cl-btn" onclick="gcAddLine('${tok}',document.getElementById('${inputId}').value)">+ Línea</button><span class="cl-hint">${usedBars}/${maxBars} compases</span></div>`;
  stack+='</div>';
  return stack;
}

/* Resize handles (any line container), allowing growth beyond one bar up to max. */
function bindChordResizeGeneric(container){
  const ref=refFromContainer(container);if(!ref)return;
  const lineBeats=parseFloat(container.dataset.linebeats)||sigBeats();
  container.querySelectorAll('.chord-resize').forEach(handle=>{
    handle.addEventListener('mousedown',md=>{
      md.preventDefault();md.stopPropagation();
      const idx=parseInt(handle.dataset.idx);
      const startX=md.clientX;
      const base=refGet(ref).map(c=>({...c}));
      const hasNeighbor=!!container.querySelector(`.chord-slot[data-idx="${idx+1}"]`);
      const pxPerBeat=container.getBoundingClientRect().width/lineBeats;
      handle.classList.add('dragging');document.body.style.cursor='col-resize';
      function move(mv){
        const delta=(mv.clientX-startX)/pxPerBeat;
        const live=refGet(ref);
        if(hasNeighbor){
          const maxThis=base[idx].beats+base[idx+1].beats-0.5;
          const nb=clamp(round2(base[idx].beats+delta),0.5,Math.max(0.5,maxThis));
          live[idx].beats=nb;
          live[idx+1].beats=clamp(round2(base[idx+1].beats-(nb-base[idx].beats)),0.5,maxThis);
        }else{
          const others=base.reduce((s,c,k)=>s+(k===idx?0:c.beats),0);
          const free=refMaxBeats(ref)-others;
          live[idx].beats=clamp(round2(base[idx].beats+delta),0.5,Math.max(0.5,free));
        }
        container.querySelectorAll('.chord-slot').forEach(slot=>{const k=parseInt(slot.dataset.idx);if(live[k]){slot.style.flexGrow=live[k].beats;const l=slot.querySelector('.chord-beats');if(l)l.textContent=live[k].beats+'b'}});
        updateChordFill(ref);
      }
      function up(){handle.classList.remove('dragging');document.body.style.cursor='';document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);refCommit(ref)}
      document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
    });
  });
}

/* Cross-line drag-and-drop (grip-initiated). Binds every chord slot + line container. */
let _dnd=null;
function bindChordDnDAll(){
  document.querySelectorAll('.chord-slots .chord-slot').forEach(slot=>{
    const grip=slot.querySelector('.chord-grip');if(!grip)return;
    grip.addEventListener('mousedown',()=>slot.setAttribute('draggable','true'));
    grip.addEventListener('touchstart',()=>slot.setAttribute('draggable','true'),{passive:true});
    slot.addEventListener('dragstart',e=>{const ref=refFromContainer(slot);_dnd={ref,fromIdx:parseInt(slot.dataset.idx)};e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','')}catch(_){}slot.classList.add('dragging')});
    slot.addEventListener('dragend',()=>{slot.classList.remove('dragging');slot.setAttribute('draggable','false')});
    slot.addEventListener('dragover',e=>{const ref=refFromContainer(slot);if(_dnd&&refEq(_dnd.ref,ref)){e.preventDefault();slot.classList.add('drag-over')}});
    slot.addEventListener('dragleave',()=>slot.classList.remove('drag-over'));
    slot.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();slot.classList.remove('drag-over');const ref=refFromContainer(slot);if(_dnd&&refEq(_dnd.ref,ref)){moveChordAcross(ref,_dnd.fromIdx,parseInt(slot.dataset.line),parseInt(slot.dataset.linepos))}_dnd=null});
  });
  document.querySelectorAll('.chord-slots').forEach(cont=>{
    cont.addEventListener('dragover',e=>{const ref=refFromContainer(cont);if(_dnd&&refEq(_dnd.ref,ref))e.preventDefault()});
    cont.addEventListener('drop',e=>{if(e.target.closest('.chord-slot'))return;e.preventDefault();const ref=refFromContainer(cont);if(_dnd&&refEq(_dnd.ref,ref)){const line=parseInt(cont.dataset.line);const count=cont.querySelectorAll('.chord-slot').length;moveChordAcross(ref,_dnd.fromIdx,line,count)}_dnd=null});
  });
}

/* ═══════════════════════════════════════════════════════════════
   MUSS · LIBRARY + ROUTER
   Integration layer that sits on top of the workbench.
   - Holds the user's song library (persisted to localStorage)
   - Renders the dashboard (grid / list / searchable table)
   - Routes between the library screen and the workbench screen
   - Loads a song into the workbench STATE and saves edits back
   ═══════════════════════════════════════════════════════════════ */

const LIB = {
  records: [],          // [{ libId, song, genre, favorite, createdAt, updatedAt }]
  sort: 'artist',       // artist | title | genre | bpm
  sortDir: 1,           // 1 asc, -1 desc (table headers toggle this)
  view: 'grid',         // grid | list | table
  nav: 'all',           // all | recent | favorites
  genre: null,          // genre filter or null
  search: '',
  current: null,        // libId currently open in the workbench
};
const LIB_KEY = 'muss_library_v2';

const GENRE_COLORS = {
  Rock:'var(--g-rock)', Pop:'var(--g-pop)', Jazz:'var(--g-jazz)', Metal:'var(--g-metal)',
  Folk:'var(--g-folk)', Blues:'var(--g-blues)', Latin:'var(--g-latin)', Indie:'var(--g-indie)',
  Country:'var(--g-country)', Other:'var(--g-other)'
};
const genreColor = g => GENRE_COLORS[g] || 'var(--ink-faint)';

const ARTIST_PALETTE = ['#4f6ef7','#2a9d8f','#e05c3a','#c46bb0','#c08040','#4fa8b8','#4aab6d','#d4521e','#7c69f5'];
function hashColor(str){
  let h=0; for(const c of (str||'')) h=(h*31+c.charCodeAt(0))>>>0;
  return ARTIST_PALETTE[h%ARTIST_PALETTE.length];
}

/* ── Persistence ─────────────────────────────────────────────── */
function libSave(){ try{ localStorage.setItem(LIB_KEY, JSON.stringify(LIB.records)); }catch(e){} }
function libLoad(){
  try{ const d=localStorage.getItem(LIB_KEY); if(d) LIB.records=JSON.parse(d); }catch(e){ LIB.records=[]; }
}

/* ── Record helpers (read derived metadata from the muss song) ── */
const meta = {
  title: r => r.song.title || 'Sin título',
  artist: r => r.song.artist || 'Artista desconocido',
  genre: r => r.genre || r.song.genre || '',
  bpm: r => r.song.bpm || 0,
  sig: r => r.song.signature || '4/4',
  link: r => r.song.link || '',
  channels: r => (r.song.channels || []).map(c => c.type),
};

/* Build a blank muss song (mirrors workbench defaults) */
function blankSong(info){
  const chId = uid();
  const blId = uid();
  return {
    title: info.title || '',
    artist: info.artist || '',
    genre: info.genre || '',
    link: info.link || '',
    bpm: info.bpm || 120,
    signature: info.signature || '4/4',
    channels: [{ id: chId, name:'Vocals', type:'lyrics', color:'#4f6ef7', muted:false }],
    blocks: [{ id: blId, section:'VERSE', bars:4, enabled:true, comment:'', content:{ [chId]:{ text:'' } } }],
    progressions: [],
    library: { riffs: [] },
  };
}

/* Normalize an imported / loaded song so the workbench can render it */
function normalizeSong(song){
  song.channels = song.channels || [];
  song.blocks = song.blocks || [];
  song.progressions = song.progressions || [];
  if(!song.library) song.library = { riffs: [] };
  if(!song.library.riffs) song.library.riffs = [];
  return song;
}

/* ── Filtering & sorting ─────────────────────────────────────── */
function libFiltered(){
  let list = [...LIB.records];
  const q = LIB.search.toLowerCase().trim();
  if(q) list = list.filter(r => meta.title(r).toLowerCase().includes(q) || meta.artist(r).toLowerCase().includes(q));
  if(LIB.nav === 'favorites') list = list.filter(r => r.favorite);
  if(LIB.nav === 'recent'){ const cut = Date.now()-8.64e7*30; list = list.filter(r => (r.updatedAt||r.createdAt) > cut); }
  if(LIB.genre) list = list.filter(r => meta.genre(r) === LIB.genre);
  return list;
}
function libSorted(list){
  const k = LIB.sort, dir = LIB.sortDir;
  return [...list].sort((a,b)=>{
    if(k==='bpm') return (meta.bpm(b)-meta.bpm(a))*dir*-1; // bpm default high→low when asc feels natural
    const va=(k==='title'?meta.title(a):k==='genre'?meta.genre(a):meta.artist(a)).toLowerCase();
    const vb=(k==='title'?meta.title(b):k==='genre'?meta.genre(b):meta.artist(b)).toLowerCase();
    return (va<vb?-1:va>vb?1:0)*dir;
  });
}
function libGrouped(list){
  const k = LIB.sort, groups = {};
  list.forEach(r=>{
    let g='';
    if(k==='artist') g=meta.artist(r);
    else if(k==='genre') g=meta.genre(r)||'Sin género';
    else if(k==='title') g=meta.title(r).charAt(0).toUpperCase();
    (groups[g] ||= []).push(r);
  });
  return groups;
}

/* ── Render: counts, genres, list ────────────────────────────── */
function libRender(){ libUpdateCounts(); libRenderGenres(); libRenderList(); }

function libUpdateCounts(){
  const all = LIB.records.length;
  const recent = LIB.records.filter(r => (r.updatedAt||r.createdAt) > Date.now()-8.64e7*30).length;
  const fav = LIB.records.filter(r => r.favorite).length;
  $('#cntAll').textContent = all;
  $('#cntRecent').textContent = recent;
  $('#cntFav').textContent = fav;
  const vis = libFiltered().length;
  const titles = { all:'Todas las canciones', recent:'Recientes', favorites:'Favoritas' };
  const sub = `${vis} canción${vis!==1?'es':''}${LIB.genre?` · ${escapeHTML(LIB.genre)}`:''}`;
  $('#libTitle').innerHTML = `${escapeHTML(titles[LIB.nav])} <span>— ${sub}</span>`;
}

function libRenderGenres(){
  const counts = {};
  LIB.records.forEach(r => { const g=meta.genre(r); (counts[g] ??= 0, counts[g]++); });
  const el = $('#libGenres'); el.innerHTML='';
  const all = document.createElement('div');
  all.className = 'lib-genre'+(LIB.genre===null?' active':'');
  all.innerHTML = `<div class="lib-dot" style="background:var(--accent-dim)"></div><span class="lib-genre-name">Todos</span><span class="lib-genre-count">${LIB.records.length}</span>`;
  all.onclick = ()=>{ LIB.genre=null; libRender(); };
  el.appendChild(all);
  Object.entries(counts).sort((a,b)=>b[1]-a[1]).forEach(([g,c])=>{
    const d = document.createElement('div');
    d.className = 'lib-genre'+(LIB.genre===g?' active':'');
    d.innerHTML = `<div class="lib-dot" style="background:${genreColor(g)}"></div><span class="lib-genre-name">${escapeHTML(g||'Sin género')}</span><span class="lib-genre-count">${c}</span>`;
    d.onclick = ()=>{ LIB.genre=g; libRender(); };
    el.appendChild(d);
  });
}

function libRenderList(){
  const data = libSorted(libFiltered());
  const box = $('#libList');

  if(!data.length){
    box.innerHTML = `<div class="lib-empty">
      <div class="lib-empty-icon">♩</div>
      <div class="lib-empty-title">No hay canciones aquí</div>
      <div class="lib-empty-sub">Crea tu primera canción o importa un<br>archivo .muss.json para comenzar.</div>
      <button class="lib-cta" onclick="libOpenNew()">+ Nueva canción</button>
    </div>`;
    return;
  }

  if(LIB.view === 'table'){ box.innerHTML = libTableHTML(data); return; }

  // grid / list — group by sort key (except bpm = flat)
  if(LIB.sort === 'bpm'){
    box.innerHTML = `<div class="${LIB.view==='grid'?'lib-grid':'lib-list'}">${
      data.map((r,i)=> LIB.view==='grid'? libCardHTML(r) : libRowHTML(r,i+1)).join('')
    }</div>`;
    return;
  }
  const groups = libGrouped(data);
  let html='';
  Object.keys(groups).forEach(key=>{
    const songs = groups[key];
    const isArtist = LIB.sort==='artist';
    const color = isArtist ? hashColor(key) : genreColor(key);
    const initial = (key||'?').charAt(0).toUpperCase();
    html += `<div class="lib-group">
      <div class="lib-group-head">
        <div class="lib-avatar" style="background:${color}">${escapeHTML(initial)}</div>
        <div class="lib-group-name">${escapeHTML(key||'Desconocido')}</div>
        <div class="lib-group-count">${songs.length} canción${songs.length!==1?'es':''}</div>
      </div>
      <div class="${LIB.view==='grid'?'lib-grid':'lib-list'}">
        ${songs.map((r,i)=> LIB.view==='grid'? libCardHTML(r) : libRowHTML(r,i+1)).join('')}
      </div>
    </div>`;
  });
  box.innerHTML = html;
}

/* ── Templates ───────────────────────────────────────────────── */
function chDotsHTML(chans){
  return ['lyrics','rhythm','lead','bass','drums','keys']
    .map(c=>`<div class="lib-chdot ${chans.includes(c)?'on':''}"></div>`).join('');
}

function libCardHTML(r){
  const g = meta.genre(r), bg = hashColor(meta.artist(r)+meta.title(r));
  const initial = meta.title(r).charAt(0).toUpperCase();
  return `<div class="lib-card" onclick="libOpen('${r.libId}')">
    <div class="lib-thumb" style="background:linear-gradient(135deg,${bg}22,${bg}55)">
      <div class="lib-thumb-letter" style="color:${bg}">${escapeHTML(initial)}</div>
      ${g?`<div class="lib-badge" style="background:${genreColor(g)}">${escapeHTML(g)}</div>`:''}
      <div class="lib-play"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M7 5l10 5-10 5V5z"/></svg></div>
    </div>
    <div class="lib-card-ov">
      <button class="lib-mini fav ${r.favorite?'on':''}" onclick="event.stopPropagation();libFav('${r.libId}')" title="Favorito">${r.favorite?'♥':'♡'}</button>

    </div>
    <div class="lib-card-body">
      <div class="lib-card-title">${escapeHTML(meta.title(r))}</div>
      <div class="lib-card-artist">${escapeHTML(meta.artist(r))}</div>
      <div class="lib-card-meta">
        <span class="lib-bpm">${meta.bpm(r)||'—'} bpm</span>
        <span class="lib-sig">${escapeHTML(meta.sig(r))}</span>
        <div class="lib-chans">${chDotsHTML(meta.channels(r))}</div>

}

function libRowHTML(r,i){
  return `<div class="lib-row" onclick="libOpen('${r.libId}')">
    <div class="lib-row-num">${i}</div>
    <div class="lib-row-info">
      <div class="lib-row-title">${escapeHTML(meta.title(r))}</div>
      <div class="lib-row-artist">${escapeHTML(meta.artist(r))}</div>
    </div>
    <div class="lib-dot" style="background:${genreColor(meta.genre(r))}" title="${escapeHTML(meta.genre(r))}"></div>
    <div class="lib-row-bpm">${meta.bpm(r)||'—'} bpm</div>
    <div class="lib-row-sig">${escapeHTML(meta.sig(r))}</div>
    <div class="lib-row-acts">
      <button class="lib-num fav ${r.favorite?'on':''}" onclick="event.stopPropagation();libFav('${r.libId}')" title="Favorito">${r.favorite?'♥':'♡'}</button>
      <button class="lib-num del" onclick="event.stopPropagation();libDelete('${r.libId}')" title="Eliminar">✕</button>
    </div>
  </div>`;
}

/* Searchable table view with sortable headers */
function libTableHTML(data){
  const cols = [
    { k:'#',        label:'#',        cls:'col-num' },
    { k:'title',    label:'Título',   sort:'title' },
    { k:'artist',   label:'Artista',  sort:'artist' },
    { k:'genre',    label:'Género',   sort:'genre', cls:'col-genre' },
    { k:'bpm',      label:'BPM',      sort:'bpm', cls:'center' },
    { k:'sig',      label:'Compás',   cls:'center col-sig' },
    { k:'chans',    label:'Canales',  cls:'center col-chans' },
    { k:'acts',     label:'',         cls:'center' },
  ];
  const arrow = c => c.sort===LIB.sort ? `<span class="arr">${LIB.sortDir>0?'▲':'▼'}</span>` : '';
  const head = cols.map(c=>{
    const sortable = c.sort ? `onclick="libSortTable('${c.sort}')"` : '';
    return `<th class="${c.cls||''}" ${sortable}>${c.label}${c.sort?arrow(c):''}</th>`;
  }).join('');

  const rows = data.map((r,i)=>`<tr onclick="libOpen('${r.libId}')">
    <td class="lib-td-mono lib-td-center col-num">${i+1}</td>
    <td><div class="lib-td-title">${escapeHTML(meta.title(r))}</div></td>
    <td>${escapeHTML(meta.artist(r))}</td>
    <td class="col-genre">${meta.genre(r)?`<span class="lib-pill"><span class="lib-dot" style="background:${genreColor(meta.genre(r))}"></span>${escapeHTML(meta.genre(r))}</span>`:'<span style="color:var(--ink-faint)">—</span>'}</td>
    <td class="lib-td-mono lib-td-center">${meta.bpm(r)||'—'}</td>
    <td class="lib-td-mono lib-td-center col-sig">${escapeHTML(meta.sig(r))}</td>
    <td class="lib-td-center col-chans"><div class="lib-chans" style="justify-content:center">${chDotsHTML(meta.channels(r))}</div></td>
    <td>
      <div class="lib-td-acts">
        <button class="lib-num fav ${r.favorite?'on':''}" onclick="event.stopPropagation();libFav('${r.libId}')" title="Favorito">${r.favorite?'♥':'♡'}</button>
        <button class="lib-num del" onclick="event.stopPropagation();libDelete('${r.libId}')" title="Eliminar">✕</button>
      </div>
    </td>
  </tr>`).join('');

  return `<div class="lib-table-wrap"><table class="lib-table">
    <thead><tr>${head}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

/* ── Actions ─────────────────────────────────────────────────── */
function libFav(id){
  const r = LIB.records.find(x=>x.libId===id); if(!r) return;
  r.favorite = !r.favorite; libSave(); libRender();
  flash(r.favorite?'Agregado a favoritas':'Removido de favoritas');
}
function libDelete(id){
  const r = LIB.records.find(x=>x.libId===id); if(!r) return;
  if(!confirm(`¿Eliminar "${meta.title(r)}"?`)) return;
  LIB.records = LIB.records.filter(x=>x.libId!==id);
  libSave(); libRender(); flash('Canción eliminada');
}
function libSortTable(k){
  if(LIB.sort===k) LIB.sortDir*=-1; else { LIB.sort=k; LIB.sortDir=1; }
  $$('#libSort button').forEach(b=>b.classList.toggle('active', b.dataset.sort===k));
  libRender();
}

/* ── New song modal ──────────────────────────────────────────── */
function libOpenNew(){
  ['ns_title','ns_artist','ns_link'].forEach(i=>$('#'+i).value='');
  $('#ns_genre').value=''; $('#ns_bpm').value='120'; $('#ns_sig').value='4/4';
  $('#newSongModal').classList.add('show');
  setTimeout(()=>$('#ns_title').focus(),60);
}
function libCloseNew(){ $('#newSongModal').classList.remove('show'); }
function libCreateNew(){
  const title = $('#ns_title').value.trim();
  if(!title){ $('#ns_title').focus(); return; }
  const song = blankSong({
    title,
    artist: $('#ns_artist').value.trim(),
    genre: $('#ns_genre').value,
    bpm: parseInt($('#ns_bpm').value)||120,
    signature: $('#ns_sig').value,
    link: $('#ns_link').value.trim(),
  });
  const rec = { libId:uid(), song, genre:song.genre, favorite:false, createdAt:Date.now(), updatedAt:Date.now() };
  LIB.records.unshift(rec);
  libSave(); libCloseNew();
  flash(`"${title}" creada`);
  libOpen(rec.libId);  // jump straight into the editor
}

/* ── Import .muss.json into the library ──────────────────────── */
function libHandleImport(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      const song = normalizeSong(d.song || d);
      if(!song.title) song.title='Sin título';
      const rec = { libId:uid(), song, genre:song.genre||'', favorite:false, createdAt:Date.now(), updatedAt:Date.now() };
      LIB.records.unshift(rec);
      libSave(); libRender();
      flash(`"${song.title}" importada`);
    }catch(err){ alert('Error al importar: '+err.message); }
  };
  r.readAsText(f); e.target.value='';
}

/* ════════ ROUTER ════════ */
function showScreen(name){
  $$('.screen').forEach(s=>s.classList.remove('active'));
  $('#screen-'+name).classList.add('active');
}

/* Open a song record in the workbench */
function libOpen(id){
  const r = LIB.records.find(x=>x.libId===id); if(!r) return;
  LIB.current = id;
  // Deep copy so workbench edits don't mutate the library until we save back
  STATE.song = normalizeSong(JSON.parse(JSON.stringify(r.song)));
  STATE.ui.activeChannelId = STATE.song.channels[0]?.id || null;
  STATE.ui.view = 'overview';
  STATE.ui.currentBlockIndex = 0;
  STATE.ui.currentBeat = 0;
  $$('.view-tab').forEach(t=>t.classList.toggle('active', t.dataset.view==='overview'));
  showScreen('workbench');
  renderAll();
  renderBeatLeds();
  $('#autoScroll').classList.toggle('on', STATE.ui.autoScroll);
}

/* Persist current workbench edits back into the library, then go home */
function libBack(){
  if(STATE.ui.isPlaying) stopPlayback();
  if(LIB.current){
    const r = LIB.records.find(x=>x.libId===LIB.current);
    if(r){
      r.song = JSON.parse(JSON.stringify(STATE.song));
      r.genre = STATE.song.genre || r.genre || '';
      r.updatedAt = Date.now();
      libSave();
    }
  }
  LIB.current = null;
  showScreen('library');
  libRender();
}

/* ── Library event bindings ──────────────────────────────────── */
function libBind(){
  $('#libSearch').addEventListener('input', e=>{ LIB.search=e.target.value; libRender(); });
  $$('#screen-library [data-nav]').forEach(el=>el.addEventListener('click',()=>{
    LIB.nav = el.dataset.nav; LIB.genre=null;
    $$('#screen-library [data-nav]').forEach(x=>x.classList.toggle('active', x===el));
    libRender();
  }));
